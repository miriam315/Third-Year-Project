<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>שנה ג׳ — רך וידידותי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF6EF; --surface:#FFFFFF; --surface-2:#F7F2FC;
  --ink:#2A2340; --ink-2:#5B5370; --line:#ECE3F4;
  --primary:#6B47C2; --primary-strong:#4F2FA3; --primary-soft:#EFE8FC; --on-primary:#FFFFFF;
  --peach:#FFE5D6; --peach-ink:#93360F; --coral:#EE8667;
  --mint:#DCF3E7; --mint-ink:#195F40;
  --sky:#E1EDFB; --sky-ink:#1D4C82;
  --sun:#FFF0C4; --sun-ink:#6E4D00;
  --rose:#FCE0E4; --rose-ink:#992036;
  --gray:#EEEAF2; --gray-ink:#4A445C;
  --radius:20px; --radius-sm:14px;
  --shadow:0 1px 0 rgba(80,50,140,.04), 0 8px 24px rgba(80,50,140,.08);
  --tabbar-h:72px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Rubik","Varela Round",system-ui,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.55;overflow-x:hidden;padding-bottom:calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom))}
a{color:var(--primary-strong)}
h1,h2,h3{line-height:1.25;margin:0}
h1{font-size:1.5rem;font-weight:700}
h2{font-size:1.15rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:3px;border-radius:10px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;top:-60px;right:12px;background:var(--primary);color:#fff;padding:10px 16px;border-radius:999px;z-index:100}
.skip:focus{top:12px}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}

/* ---------- Header ---------- */
.top{background:linear-gradient(160deg,#EDE4FD 0%,#FBE9E0 100%);padding:16px 16px 28px;border-radius:0 0 32px 32px}
.top-inner{max-width:1080px;margin:0 auto}
.top-links{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.85rem;margin-bottom:14px}
.top-links a{color:var(--ink);text-decoration:none;background:rgba(255,255,255,.7);padding:6px 12px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
.top-links a:hover{background:#fff}
.hello{display:flex;align-items:center;gap:14px}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:1.15rem;flex:none;box-shadow:0 0 0 4px rgba(255,255,255,.8)}
.hello small{display:block;color:var(--ink-2);font-size:.9rem}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chip{background:rgba(255,255,255,.8);border-radius:999px;padding:2px 10px;font-size:.8rem;color:var(--ink)}

/* ---------- Nav ---------- */
.topnav{display:none}
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:40;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(80,50,140,.08);border-radius:22px 22px 0 0}
.tabbar a,.tabbar button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--ink-2);font-size:.72rem;padding:6px 2px;border-radius:14px;background:none;border:0;cursor:pointer}
.tabbar a[aria-current="page"],.tabbar button[aria-expanded="true"],.tabbar button.on{color:var(--primary-strong);font-weight:600}
.tabbar a[aria-current="page"] .ic,.tabbar button.on .ic{background:var(--primary-soft)}
.tabbar .ic{display:grid;place-items:center;width:44px;height:28px;border-radius:999px}
@media (min-width:900px){
  body{padding-bottom:32px}
  .tabbar{display:none}
  .topnav{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;max-width:1080px;margin:-22px auto 0;padding:8px;background:#fff;border-radius:999px;box-shadow:var(--shadow);position:relative;z-index:2;width:max-content;max-width:calc(100% - 32px)}
  .topnav a{text-decoration:none;color:var(--ink-2);padding:8px 16px;border-radius:999px;display:inline-flex;gap:6px;align-items:center;font-size:.95rem}
  .topnav a:hover{background:var(--surface-2);color:var(--ink)}
  .topnav a[aria-current="page"]{background:var(--primary);color:#fff}
  .top{padding-bottom:40px}
}

/* ---------- Layout ---------- */
main{max-width:1080px;margin:0 auto;padding:20px 16px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:4px 0 16px}
.page-head p{color:var(--ink-2);font-size:.92rem}
.grid{display:grid;gap:16px}
@media (min-width:700px){.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--ink-2)}
.small{font-size:.85rem}
.mt{margin-top:16px}

.card{background:var(--surface);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);min-width:0}
.card h2,.card h3{margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card-link{display:block;text-decoration:none;color:inherit;transition:transform .15s, box-shadow .15s;position:relative}
.card-link:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(80,50,140,.14)}
.card-link .go{position:absolute;top:18px;left:18px;color:var(--primary)}
.emoji{font-size:1.4rem;line-height:1}
.badge-ico{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:1.25rem;flex:none}
.big-num{font-size:2.1rem;font-weight:700;line-height:1}

.hero{background:linear-gradient(135deg,#6B47C2 0%,#9A6BE0 60%,#F0A08A 130%);color:#fff;border-radius:28px;padding:22px;box-shadow:0 14px 30px rgba(107,71,194,.28);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12);left:-50px;top:-60px}
.hero .kicker{display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.2);padding:4px 12px;border-radius:999px;font-size:.82rem;margin-bottom:10px}
.hero h2{font-size:1.35rem;margin-bottom:6px;position:relative;z-index:1}
.hero p{opacity:.95;position:relative;z-index:1}
.hero .btn{margin-top:16px;position:relative;z-index:1}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:10px 20px;font-weight:600;cursor:pointer;text-decoration:none;min-height:44px;background:var(--primary);color:#fff;font-size:.95rem}
.btn:hover{background:var(--primary-strong)}
.btn.soft{background:var(--primary-soft);color:var(--primary-strong)}
.btn.soft:hover{background:#E2D7FA}
.btn.white{background:#fff;color:var(--primary-strong)}
.btn.white:hover{background:#F6F1FF}
.btn.ghost{background:transparent;color:var(--primary-strong);border:2px solid var(--primary-soft)}
.btn.danger{background:var(--rose-ink)}
.btn.sm{min-height:36px;padding:6px 14px;font-size:.85rem}
.btn[disabled],.btn[aria-disabled="true"]{background:var(--gray);color:#7C768C;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--primary-strong);text-decoration:underline;cursor:pointer;font-weight:500}

/* ---------- Pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 11px;font-size:.8rem;font-weight:600;white-space:nowrap;border:1.5px solid transparent}
.pill .pi{font-size:.85em}
.p-ok{background:var(--mint);color:var(--mint-ink)}
.p-warn{background:var(--sun);color:var(--sun-ink)}
.p-bad{background:var(--rose);color:var(--rose-ink)}
.p-info{background:var(--sky);color:var(--sky-ink)}
.p-peach{background:var(--peach);color:var(--peach-ink)}
.p-violet{background:var(--primary-soft);color:var(--primary-strong)}
.p-muted{background:#fff;color:var(--gray-ink);border:1.5px dashed #A9A2B8}
.p-gray{background:var(--gray);color:var(--gray-ink)}

/* ---------- Progress ---------- */
.bar{height:14px;background:var(--gray);border-radius:999px;overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.bar .b-ok{background:#3FA779}
.bar .b-pend{background:repeating-linear-gradient(45deg,#F5C24A 0 6px,#F9D77F 6px 12px)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-left:5px}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:1.3rem}

/* ---------- Lists ---------- */
.item{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:var(--radius-sm);background:var(--surface-2)}
.item + .item{margin-top:8px}
.item .meta{color:var(--ink-2);font-size:.85rem}
.timebox{background:#fff;border-radius:12px;padding:6px 10px;text-align:center;min-width:64px;font-weight:600;font-size:.9rem;flex:none;border:1px solid var(--line)}
.timebox small{display:block;font-weight:400;color:var(--ink-2);font-size:.75rem}
.day-label{font-weight:600;margin:18px 4px 8px;display:flex;gap:8px;align-items:center}
.session{background:#fff;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.session + .session{margin-top:10px}
.session .body{flex:1;min-width:180px}
.session.cancelled{background:#FBF8FC;box-shadow:none;border:2px dashed #D6CCE0}
.session.cancelled .strike{text-decoration:line-through;text-decoration-thickness:2px;color:#6E6780}
.session.updated{border-inline-start:6px solid #F5C24A}
.change-note{margin-top:8px;padding:8px 12px;border-radius:12px;font-size:.88rem}
.feedback{background:var(--peach);color:var(--peach-ink);border-radius:14px;padding:10px 14px;margin-top:10px;font-size:.9rem}
.feedback b{display:block}
.empty{text-align:center;padding:28px;color:var(--ink-2)}
.empty .emoji{font-size:2rem;display:block;margin-bottom:6px}

/* ---------- Filters ---------- */
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:#fff;padding:14px;border-radius:var(--radius);box-shadow:var(--shadow)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 14px;cursor:pointer;color:var(--ink-2);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--primary);color:#fff}
.check{display:inline-flex;align-items:center;gap:8px;min-height:44px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--primary)}

/* ---------- Forms ---------- */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lbl{font-weight:500;font-size:.9rem}
.req::after{content:" *";color:var(--rose-ink)}
.input,select.input,textarea.input{width:100%;border:2px solid var(--line);background:#FFFDFB;border-radius:14px;padding:10px 14px;min-height:44px}
textarea.input{min-height:90px;resize:vertical}
.input:focus{border-color:var(--primary);outline:none;box-shadow:0 0 0 3px var(--primary-soft)}
.input[aria-invalid="true"]{border-color:var(--rose-ink);background:#FFF7F8}
.err{color:var(--rose-ink);font-size:.82rem;min-height:0}
.err:not(:empty)::before{content:"⚠ "}
.hint{color:var(--ink-2);font-size:.8rem}
.form-grid{display:grid;gap:14px}
@media (min-width:640px){.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.form-grid .full{grid-column:1/-1}}
.form-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.radio-cards{display:flex;gap:8px;flex-wrap:wrap}
.radio-cards label{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:44px}
.radio-cards input{accent-color:var(--primary)}

/* ---------- Table ---------- */
.table-wrap{overflow-x:auto;border-radius:var(--radius-sm)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:600;color:var(--ink-2);font-size:.82rem;background:var(--surface-2)}

/* ---------- Stepper ---------- */
.stepper{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:18px}
.step:not(:last-child)::before{content:"";position:absolute;right:17px;top:36px;bottom:0;width:3px;background:var(--line);border-radius:2px}
.step.done:not(:last-child)::before{background:#8ED1B0}
.dot{width:37px;height:37px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;z-index:1;font-size:.95rem}
.step.done .dot{background:var(--mint);color:var(--mint-ink)}
.step.current .dot{background:var(--primary);color:#fff;box-shadow:0 0 0 5px var(--primary-soft)}
.step.locked .dot{background:var(--gray);color:var(--gray-ink)}
.step .st{font-size:.8rem;color:var(--ink-2)}
@media (min-width:760px){
  .stepper{flex-direction:row}
  .step{flex:1;flex-direction:column;align-items:center;text-align:center;padding-bottom:0}
  .step:not(:last-child)::before{right:auto;left:-50%;width:100%;height:3px;top:17px;bottom:auto;transform:translateX(18px)}
  html[dir="rtl"] .step:not(:last-child)::before{left:auto;right:50%;transform:translateX(-18px);width:100%}
}
.blocker{background:var(--rose);color:var(--rose-ink);border-radius:var(--radius);padding:16px}
.blocker ul{margin:6px 0 0;padding-inline-start:20px}

/* ---------- Chat ---------- */
.thread{display:flex;flex-direction:column;gap:10px}
.msg{max-width:85%;padding:10px 14px;border-radius:18px;font-size:.95rem}
.msg .who{font-size:.75rem;color:var(--ink-2);display:block;margin-bottom:2px}
.msg.me{align-self:flex-start;background:var(--primary-soft);border-bottom-right-radius:6px}
.msg.them{align-self:flex-end;background:#fff;border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.sys{align-self:center;background:transparent;color:var(--ink-2);font-size:.8rem}

/* ---------- Modal / Sheet ---------- */
.backdrop{position:fixed;inset:0;background:rgba(42,35,64,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:#fff;width:100%;max-height:90vh;overflow:auto;border-radius:28px 28px 0 0;padding:8px 18px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.sheet .grab{width:44px;height:5px;background:var(--line);border-radius:999px;margin:6px auto 12px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface-2);cursor:pointer;display:grid;place-items:center;flex:none}
@media (min-width:700px){.backdrop{align-items:center}.sheet{max-width:560px;border-radius:28px;padding:18px 24px 24px}.sheet .grab{display:none}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.menu-list a{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;text-decoration:none;color:var(--ink);background:var(--surface-2);margin-bottom:8px}
.menu-list a[aria-current="page"]{background:var(--primary-soft);font-weight:600}

/* ---------- Toast ---------- */
.toasts{position:fixed;z-index:80;left:16px;right:16px;bottom:calc(var(--tabbar-h) + 14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
@media (min-width:900px){.toasts{bottom:24px}}
.toast{background:var(--ink);color:#fff;padding:12px 18px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.2);max-width:460px;display:flex;gap:10px;align-items:center;animation:up .2s;pointer-events:auto}
.toast.ok{background:#1F5E43}
.toast.bad{background:#8E1F33}

.slot{border:2px solid var(--line);background:#fff;border-radius:18px;padding:12px;text-align:center;cursor:pointer;min-height:44px}
.slot[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.slot[disabled]{background:var(--gray);color:#6E6780;cursor:not-allowed;border-style:dashed}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.type-card{text-align:right;border:2px solid var(--line);background:#fff;border-radius:var(--radius);padding:14px;cursor:pointer;width:100%}
.type-card[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.cond{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.cond .mk{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;font-size:.85rem}
.cond.ok .mk{background:var(--mint);color:var(--mint-ink)}
.cond.no .mk{background:var(--rose);color:var(--rose-ink)}
.steps-mini{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.steps-mini span{padding:4px 12px;border-radius:999px;background:var(--gray);font-size:.8rem;color:var(--gray-ink)}
.steps-mini span.on{background:var(--primary);color:#fff}
.steps-mini span.done{background:var(--mint);color:var(--mint-ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.95rem}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;font-weight:500}
.member{display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:999px;padding:4px 12px 4px 4px}
.member .av{width:30px;height:30px;border-radius:50%;background:var(--peach);color:var(--peach-ink);display:grid;place-items:center;font-size:.8rem;font-weight:700}

/* ---------- Role switch ---------- */
.role-switch{display:inline-flex;background:rgba(255,255,255,.75);border-radius:999px;padding:4px;gap:2px}
.top-links .role-switch a{background:transparent;padding:6px 14px;font-weight:500}
.top-links .role-switch a[aria-current="true"]{background:var(--primary);color:#fff}
body[data-role="admin"] .top{background:linear-gradient(160deg,#FCE6DA 0%,#E7E0FB 100%)}

/* ---------- Admin ---------- */
.kpis{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:700px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{padding:16px}
.kpi .emoji{display:block;margin-bottom:8px}
.kpi .kpi-l{font-weight:500;font-size:.9rem;margin-top:4px}
.kpi.alert{background:var(--rose);color:var(--rose-ink)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:thin}
.tabs button{flex:none;border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;min-height:40px;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.internal{background:#FFF7DC;border:2px dashed #D9A93A}
.internal .note{background:#fff;border-radius:14px;padding:10px 12px;margin-bottom:8px;border:1px solid #F0DCA0}
.internal .who{color:var(--sun-ink)}
.restricted{text-align:center;background:repeating-linear-gradient(45deg,#F4F1F7 0 12px,#ECE8F1 12px 24px);padding:36px 20px}
.rtable{width:100%}
.rtable td .input{min-height:40px}
@media (max-width:760px){
  .rtable thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .rtable,.rtable tbody,.rtable tr,.rtable td{display:block;width:100%}
  .rtable tr{background:var(--surface-2);border-radius:16px;padding:8px 12px;margin-bottom:10px}
  .rtable td{border:0;padding:5px 0;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;text-align:right}
  .rtable td[data-label]::before{content:attr(data-label);color:var(--ink-2);font-size:.82rem;font-weight:500}
  .rtable td .input{max-width:60% !important}
}
</style>
</head>
<body>
<a class="skip" href="#main">דלגי לתוכן הראשי</a>

<header class="top">
  <div class="top-inner">
    <div class="top-links">
      <a href="index.html"><span aria-hidden="true">→</span> כל העיצובים</a>
      <nav class="role-switch" id="role-switch" aria-label="החלפת תפקיד"></nav>
    </div>
    <div class="hello" id="hello"></div>
  </div>
</header>
<nav class="topnav" id="topnav" aria-label="ניווט ראשי"></nav>

<main id="main" tabindex="-1"></main>

<nav class="tabbar" id="tabbar" aria-label="ניווט ראשי (נייד)"></nav>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script src="shared/data.js"></script>
<script>
(function () {
  'use strict';
  var M = window.MOCK;
  var main = document.getElementById('main');
  if (!M) { main.innerHTML = '<div class="card">לא נמצאו נתוני דמה (shared/data.js).</div>'; return; }

  /* ---------- מצב בזיכרון (עותק של נתוני הדמה) ---------- */
  var S = JSON.parse(JSON.stringify(M));
  var ui = {
    schedCourse: 'all', schedMode: 'all', schedCancelled: true,
    practForm: null,          // null | {editId}
    projForm: false,
    meet: { step: 'type', typeId: null, slotId: null, result: null },
    reqForm: false,
    seq: { ac: 312, pr: 96, ap: 2231, rq: 1102 }
  };

  /* ---------- כלים ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var ICONS = {
    home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/>',
    calendar: '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    check: '<path d="M20 6L9 17l-5-5"/>',
    list: '<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>',
    briefcase: '<rect x="3" y="7" width="18" height="13" rx="3"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/>',
    folder: '<path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>',
    users: '<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M16 4.5a3 3 0 010 6M21 20c0-2.4-1.2-4.2-3-5"/>',
    chat: '<path d="M4 5h16v11H9l-5 4z"/>',
    more: '<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
    video: '<rect x="3" y="6" width="12" height="12" rx="3"/><path d="M15 10l6-3v10l-6-3"/>',
    pin: '<path d="M12 21s-7-6-7-11a7 7 0 0114 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    x: '<path d="M6 6l12 12M18 6L6 18"/>',
    arrow: '<path d="M19 12H5M11 6l-6 6 6 6"/>',
    clip: '<path d="M21 12l-8.5 8.5a5 5 0 01-7-7L14 5a3.5 3.5 0 015 5l-8.5 8.5a2 2 0 01-3-3L15 8"/>',
    lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/>'
  };
  function icon(n) { return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[n] || '') + '</svg>'; }
  function pill(cls, sym, text) { return '<span class="pill ' + cls + '"><span class="pi" aria-hidden="true">' + sym + '</span>' + esc(text) + '</span>'; }
  function firstName(n) { return String(n).split(' ')[0]; }
  function initials(n) { return String(n).split(' ').map(function (p) { return p.charAt(0); }).join('').slice(0, 2); }
  function ring(pct, color, label) {
    var r = 40, c = 2 * Math.PI * r, v = Math.max(0, Math.min(100, pct || 0));
    return '<div class="ring" role="img" aria-label="' + esc(label) + '"><svg width="96" height="96" viewBox="0 0 96 96" aria-hidden="true">' +
      '<circle cx="48" cy="48" r="' + r + '" stroke="#EEEAF2" stroke-width="11" fill="none"/>' +
      '<circle cx="48" cy="48" r="' + r + '" stroke="' + color + '" stroke-width="11" fill="none" stroke-linecap="round" stroke-dasharray="' + (c * v / 100).toFixed(1) + ' ' + c.toFixed(1) + '"/>' +
      '</svg><b aria-hidden="true">' + v + '%</b></div>';
  }

  var ATT = { present: ['p-ok', '✓'], partial: ['p-warn', '◐'], absent: ['p-bad', '✕'], unreported: ['p-muted', '–'], review: ['p-info', '⏳'] };
  function attPill(st) { var a = ATT[st] || ['p-gray', '•']; return pill(a[0], a[1], S.attendanceStatus[st] || st); }
  var REP = { draft: ['p-gray', '✎'], pending: ['p-info', '⏳'], approved: ['p-ok', '✓'], returned: ['p-peach', '↩'], rejected: ['p-bad', '✕'] };
  function repPill(st) { var a = REP[st] || ['p-gray', '•']; return pill(a[0], a[1], S.reportStatus[st] || st); }
  var REQ = { new: ['p-violet', '●'], in_progress: ['p-info', '⏳'], waiting_student: ['p-peach', '!'], closed: ['p-gray', '✓'] };
  function reqPill(st) { var a = REQ[st] || ['p-gray', '•']; return pill(a[0], a[1], S.requestStatus[st] || st); }
  var SUB = { returned: ['p-peach', '↩', 'הוחזרה לתיקון'], superseded: ['p-gray', '⤺', 'הוחלפה בגרסה חדשה'], submitted: ['p-info', '⏳', 'הוגשה — ממתינה למשוב'], approved: ['p-ok', '✓', 'אושרה'] };
  function subPill(st) { var a = SUB[st] || ['p-gray', '•', st]; return pill(a[0], a[1], a[2]); }
  function oblPill(st) {
    var m = { 'חסר': ['p-bad', '✕'], 'הושלם': ['p-ok', '✓'], 'בבדיקה': ['p-info', '⏳'], 'טרם נקלט': ['p-muted', '…'] }[st] || ['p-gray', '•'];
    return pill(m[0], m[1], st);
  }

  /* ---------- טוסט ---------- */
  function toast(text, kind) {
    var box = document.getElementById('toasts');
    var t = document.createElement('div');
    t.className = 'toast ' + (kind || 'ok');
    t.innerHTML = '<span aria-hidden="true">' + (kind === 'bad' ? '⚠' : '✓') + '</span><span>' + esc(text) + '</span>';
    box.appendChild(t);
    setTimeout(function () { t.remove(); }, 4500);
  }

  /* ---------- חלון / גיליון תחתון ---------- */
  var modalState = null;
  function openModal(title, bodyHtml, onMount) {
    closeModal();
    var prev = document.activeElement;
    var bd = document.createElement('div');
    bd.className = 'backdrop';
    bd.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mdl-title"><div class="grab" aria-hidden="true"></div>' +
      '<div class="sheet-head"><h2 id="mdl-title">' + esc(title) + '</h2><button class="iconbtn" type="button" data-action="close-modal" aria-label="סגירה">' + icon('x') + '</button></div>' +
      '<div class="sheet-body">' + bodyHtml + '</div></div>';
    bd.addEventListener('mousedown', function (e) { if (e.target === bd) closeModal(); });
    document.body.appendChild(bd);
    modalState = { el: bd, prev: prev };
    var f = bd.querySelector('input:not([type=hidden]),select,textarea,button:not([data-action=close-modal])') || bd.querySelector('button');
    namedFields(bd);
    if (f) f.focus();
    if (onMount) onMount(bd);
  }
  function closeModal() {
    if (!modalState) return;
    modalState.el.remove();
    if (modalState.prev && modalState.prev.focus) modalState.prev.focus();
    modalState = null;
  }
  document.addEventListener('keydown', function (e) {
    if (!modalState) return;
    if (e.key === 'Escape') { closeModal(); return; }
    if (e.key === 'Tab') {
      var f = modalState.el.querySelectorAll('button:not([disabled]),input,select,textarea,a[href]');
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  /* ---------- ולידציה ---------- */
  function clearErrs(form) {
    form.querySelectorAll('.err').forEach(function (e) { e.textContent = ''; });
    form.querySelectorAll('[aria-invalid]').forEach(function (e) { e.removeAttribute('aria-invalid'); });
  }
  function setErr(form, name, msg) {
    var el = form.elements[name], box = form.querySelector('[data-err="' + name + '"]');
    if (box) box.textContent = msg;
    if (el && el.setAttribute) el.setAttribute('aria-invalid', 'true');
  }
  /* גישה לשדות לפי שם (form.x) גם בסביבות שאין בהן named getter */
  function namedFields(root) {
    (root || document).querySelectorAll("form").forEach(function (form) {
      Array.prototype.forEach.call(form.elements, function (el) { if (el.name && !(el.name in form)) form[el.name] = el; });
    });
  }
  function focusFirstErr(form) { var el = form.querySelector('[aria-invalid="true"]'); if (el) el.focus(); }
  function field(name, label, inputHtml, opts) {
    opts = opts || {};
    return '<div class="field' + (opts.full ? ' full' : '') + '"><label for="f-' + name + '"' + (opts.req ? ' class="req"' : '') + '>' + esc(label) + '</label>' + inputHtml +
      (opts.hint ? '<span class="hint" id="h-' + name + '">' + esc(opts.hint) + '</span>' : '') +
      '<span class="err" data-err="' + name + '" id="e-' + name + '" aria-live="polite"></span></div>';
  }
  function inp(name, type, attrs) { return '<input class="input" id="f-' + name + '" name="' + name + '" type="' + type + '" aria-describedby="e-' + name + '" ' + (attrs || '') + '>'; }
  function sel(name, options, value) {
    return '<select class="input" id="f-' + name + '" name="' + name + '" aria-describedby="e-' + name + '">' + options.map(function (o) {
      var v = typeof o === 'string' ? o : o.v, t = typeof o === 'string' ? o : o.t;
      return '<option value="' + esc(v) + '"' + (v === value ? ' selected' : '') + '>' + esc(t) + '</option>';
    }).join('') + '</select>';
  }
  function area(name, attrs) { return '<textarea class="input" id="f-' + name + '" name="' + name + '" aria-describedby="e-' + name + '" ' + (attrs || '') + '></textarea>'; }
  function toMin(t) { var p = String(t).split(':'); return (+p[0]) * 60 + (+p[1]); }
  function isoToDM(iso) { var p = iso.split('-'); return p[2] + '/' + p[1]; }

  /* ---------- ניווט ---------- */
  var NAVS = {
    student: [
      { id: 'dashboard', label: 'בית', icon: 'home', tab: true },
      { id: 'schedule', label: 'מערכת', icon: 'calendar', tab: true },
      { id: 'attendance', label: 'נוכחות', icon: 'check', tab: true },
      { id: 'practicum', label: 'פרקטיקום', icon: 'briefcase', tab: true },
      { id: 'project', label: 'פרויקט', icon: 'folder', tab: true },
      { id: 'obligations', label: 'חובות', icon: 'list' },
      { id: 'meetings', label: 'פגישות', icon: 'users' },
      { id: 'requests', label: 'פניות', icon: 'chat' }
    ],
    admin: [
      { id: 'dashboard', label: 'לוח בקרה', icon: 'home', tab: true },
      { id: 'students', label: 'תלמידות', icon: 'users', tab: true },
      { id: 'attendance', label: 'נוכחות', icon: 'check', tab: true },
      { id: 'practicum', label: 'פרקטיקום', icon: 'briefcase', tab: true },
      { id: 'meetings', label: 'פגישות', icon: 'calendar', tab: true },
      { id: 'requests', label: 'פניות', icon: 'chat' }
    ]
  };
  var NAV = NAVS.student;
  var route = { role: 'student', screen: 'dashboard', param: null, query: {} };
  function parseHash() {
    var h = (location.hash || '').slice(1);
    var q = {}, qi = h.indexOf('?');
    if (qi >= 0) { h.slice(qi + 1).split('&').forEach(function (kv) { var p = kv.split('='); if (p[0]) q[p[0]] = decodeURIComponent(p[1] || ''); }); h = h.slice(0, qi); }
    var parts = h.split('/');
    var role = parts[0] === 'admin' ? 'admin' : 'student';
    var scr = parts[0] === role ? parts[1] : null;
    var list = NAVS[role];
    if (role === 'admin' && scr === 'student') { return { role: role, screen: 'students', param: parts[2] ? decodeURIComponent(parts[2]) : null, query: q }; }
    if (!list.some(function (n) { return n.id === scr; })) scr = 'dashboard';
    return { role: role, screen: scr, param: parts[2] ? decodeURIComponent(parts[2]) : null, query: q };
  }
  function L(screen) { return '#' + route.role + '/' + screen; }
  function renderNav() {
    var cur = route.screen;
    NAV = NAVS[route.role];
    document.getElementById('topnav').innerHTML = NAV.map(function (n) {
      return '<a href="' + L(n.id) + '"' + (n.id === cur ? ' aria-current="page"' : '') + '>' + icon(n.icon) + n.label + '</a>';
    }).join('');
    var inMore = NAV.some(function (n) { return !n.tab && n.id === cur; });
    document.getElementById('tabbar').innerHTML = NAV.filter(function (n) { return n.tab; }).map(function (n) {
      return '<a href="' + L(n.id) + '"' + (n.id === cur ? ' aria-current="page"' : '') + '><span class="ic">' + icon(n.icon) + '</span>' + n.label + '</a>';
    }).join('') + '<button type="button" data-action="more" aria-haspopup="dialog" class="' + (inMore ? 'on' : '') + '"><span class="ic">' + icon('more') + '</span>עוד</button>';
  }
  function openMore() {
    var other = route.role === 'student' ? ['admin', 'מעבר לממשק ניהול'] : ['student', 'מעבר לאזור התלמידה'];
    var html = '<div class="menu-list">' + NAV.filter(function (n) { return !n.tab; }).map(function (n) {
      return '<a href="' + L(n.id) + '"' + (n.id === route.screen ? ' aria-current="page"' : '') + ' data-action="close-modal-link">' + icon(n.icon) + n.label + '</a>';
    }).join('') +
      '<a href="#' + other[0] + '/dashboard" data-action="close-modal-link">' + icon('users') + other[1] + '</a><a href="index.html">' + icon('arrow') + 'חזרה לכל העיצובים</a></div>';
    openModal('עוד', html);
  }

  function renderHeader() {
    var hr = new Date().getHours();
    var greet = hr < 12 ? 'בוקר טוב' : hr < 18 ? 'צהריים טובים' : 'ערב טוב';
    var isA = route.role === 'admin';
    document.getElementById('role-switch').innerHTML =
      '<a href="#student/dashboard"' + (!isA ? ' aria-current="true"' : '') + '>🎓 תלמידה</a><a href="#admin/dashboard"' + (isA ? ' aria-current="true"' : '') + '>🗂️ ניהול</a>';
    document.getElementById('hello').innerHTML = isA ?
      '<div class="avatar" aria-hidden="true" style="background:#E06E4E">' + esc(S.staffUser.initials) + '</div>' +
      '<div><h1>' + greet + ', ' + esc(firstName(S.staffUser.name)) + ' <span aria-hidden="true">☕</span></h1>' +
      '<div class="chips"><span class="chip">' + esc(S.staffUser.role) + '</span><span class="chip">' + esc(S.staffUser.scope) + '</span></div></div>'
      :
      '<div class="avatar" aria-hidden="true">' + esc(S.me.initials) + '</div>' +
      '<div><h1>' + greet + ', ' + esc(firstName(S.me.name)) + ' <span aria-hidden="true">🌸</span></h1>' +
      '<div class="chips"><span class="chip">' + esc(S.me.cohort) + '</span><span class="chip">מסלול ' + esc(S.me.track) + '</span><span class="chip">ת״ז מוסדית ' + esc(S.me.institutionalId) + '</span></div></div>';
  }

  /* =====================================================================
     S02 — לוח בית
     ===================================================================== */
  function viewDashboard() {
    var na = S.nextAction;
    var openObl = S.obligations.filter(function (o) { return o.status !== 'הושלם'; });
    var waiting = S.requests.filter(function (r) { return r.status === 'waiting_student'; });
    var p = S.practicum, pct = Math.round(p.approved / p.target * 100);
    var cur = S.project.stages.filter(function (s) { return s.status === 'current'; })[0];
    var last = S.project.submissions[0];
    var upcoming = S.sessions.slice(0, 3);

    var h = '<h2 class="sr-only" id="page-title" tabindex="-1">לוח הבית</h2>';
    h += '<section class="hero" aria-labelledby="na-title"><span class="kicker"><span aria-hidden="true">✨</span> הפעולה הבאה שלך' + (na.urgency === 'high' ? ' · דחוף' : '') + '</span>' +
      '<h2 id="na-title">' + esc(na.title) + '</h2><p>' + esc(na.detail) + '</p>' +
      '<a class="btn white" href="#student/' + esc(na.screen) + '">' + esc(na.cta) + ' ' + icon('arrow') + '</a></section>';

    h += '<div class="grid grid-2 mt">';
    // מפגשים קרובים
    h += '<a class="card card-link" href="#student/schedule"><span class="go" aria-hidden="true">' + icon('arrow') + '</span><h2><span class="badge-ico" style="background:var(--sky)" aria-hidden="true">📅</span>המפגשים הקרובים</h2>' +
      upcoming.map(function (s) {
        var st = s.status === 'cancelled' ? pill('p-bad', '✕', 'בוטל') : s.status === 'updated' ? pill('p-warn', '↻', 'עודכן') : '';
        return '<div class="item"><div class="timebox">' + esc(s.start) + '<small>' + esc(s.day) + ' ' + esc(s.date) + '</small></div><div><b class="' + (s.status === 'cancelled' ? 'strike' : '') + '">' + esc(s.course) + '</b> ' + st +
          '<div class="meta">' + (s.mode === 'זום' ? '💻 זום' : '🏫 פרונטלי') + ' · ' + esc(s.start) + '–' + esc(s.end) + '</div></div></div>';
      }).join('') + '</a>';

    // פרקטיקום
    h += '<a class="card card-link" href="#student/practicum"><span class="go" aria-hidden="true">' + icon('arrow') + '</span><h2><span class="badge-ico" style="background:var(--mint)" aria-hidden="true">💼</span>שעות פרקטיקום</h2>' +
      '<div class="row">' + ring(pct, '#3FA779', 'אושרו ' + p.approved + ' מתוך ' + p.target + ' שעות') +
      '<div><div class="big-num">' + p.approved + '<span class="muted small"> / ' + p.target + ' ש׳</span></div><div class="muted small">שעות מאושרות מתוך יעד</div>' +
      '<div class="muted small">⏳ ' + p.pending + ' ש׳ ממתינות לאישור</div></div></div></a>';

    // חובות
    h += '<a class="card card-link" href="#student/obligations"><span class="go" aria-hidden="true">' + icon('arrow') + '</span><h2><span class="badge-ico" style="background:var(--peach)" aria-hidden="true">📋</span>חובות פתוחים</h2>' +
      '<div class="row"><span class="big-num">' + openObl.length + '</span><span class="muted">דרישות שטרם הושלמו</span></div>' +
      '<div class="row mt">' + openObl.slice(0, 3).map(function (o) { return oblPill(o.status); }).join('') + '</div></a>';

    // פרויקט
    h += '<a class="card card-link" href="#student/project"><span class="go" aria-hidden="true">' + icon('arrow') + '</span><h2><span class="badge-ico" style="background:var(--primary-soft)" aria-hidden="true">🚀</span>הפרויקט שלי</h2>' +
      '<p class="muted small">' + esc(S.project.name) + '</p>' +
      '<p class="mt">שלב נוכחי: <b>' + esc(cur ? cur.name : '—') + '</b>' + (cur && cur.due ? ' · עד ' + esc(cur.due) : '') + '</p>' +
      (last ? '<p class="row" style="margin-top:6px">הגשה אחרונה (גרסה ' + last.version + '): ' + subPill(last.status) + '</p>' : '') + '</a>';

    // פניות
    h += '<a class="card card-link" href="#student/requests"><span class="go" aria-hidden="true">' + icon('arrow') + '</span><h2><span class="badge-ico" style="background:var(--sun)" aria-hidden="true">💬</span>ממתינות לתשובתך</h2>' +
      (waiting.length ? waiting.map(function (r) { return '<div class="item"><div><b>' + esc(r.subject) + '</b><div class="meta">' + esc(r.id) + ' · ' + esc(r.owner) + '</div>' + (r.lastMsg ? '<div class="small">״' + esc(r.lastMsg) + '״</div>' : '') + '</div></div>'; }).join('')
        : '<p class="muted">אין פניות שממתינות לך <span aria-hidden="true">🎉</span></p>') + '</a>';

    // נוכחות
    h += '<a class="card card-link" href="#student/attendance"><span class="go" aria-hidden="true">' + icon('arrow') + '</span><h2><span class="badge-ico" style="background:var(--sky)" aria-hidden="true">✅</span>נוכחות</h2>' +
      '<div class="row">' + ring(S.attendance.summaryPct, '#6B47C2', 'נוכחות כוללת ' + S.attendance.summaryPct + '%') +
      '<div class="stack" style="gap:4px">' + S.courses.map(function (c) {
        return '<span class="small">' + esc(c.name) + ': <b>' + (c.attendance == null ? '—' : c.attendance + '%') + '</b></span>';
      }).join('') + '</div></div></a>';
    h += '</div>';

    // הודעות + פגישות
    h += '<div class="grid grid-2 mt">';
    h += '<section class="card" aria-labelledby="ann-t"><h2 id="ann-t"><span class="badge-ico" style="background:var(--peach)" aria-hidden="true">📣</span>הודעות ועדכונים</h2>' +
      S.announcements.map(function (a) {
        return '<div class="item"><div class="timebox">' + esc(a.date) + '</div><div>' + (a.kind === 'changed' ? pill('p-warn', '↻', 'שינוי במערכת') + ' ' : pill('p-info', 'i', 'מידע') + ' ') + '<p style="margin-top:4px">' + esc(a.text) + '</p></div></div>';
      }).join('') + '</section>';
    h += '<a class="card card-link" href="#student/meetings"><span class="go" aria-hidden="true">' + icon('arrow') + '</span><h2><span class="badge-ico" style="background:var(--mint)" aria-hidden="true">🤝</span>הפגישות שלי</h2>' +
      (S.myAppointments.length ? S.myAppointments.map(function (a) {

      '<div class="legend"><span><i style="background:#3FA779"></i>אושרו ' + p.approved + '</span><span><i style="background:#F5C24A"></i>ממתינות ' + p.pending + '</span><span><i style="background:#EEEAF2;border:1px solid #ccc"></i>נותרו ' + Math.max(0, p.target - p.approved - p.pending) + '</span><span>יעד: ' + p.target + ' ש׳</span></div></section>';

    if (ui.practForm) h += practFormHtml();

        '<div style="flex:1;min-width:160px"><b>' + esc(r.task) + '</b><div class="meta">' + esc(r.id) + '</div>' +

  function practFormHtml() {
    var r = ui.practForm.editId ? S.practicum.reports.filter(function (x) { return x.id === ui.practForm.editId; })[0] : null;
    var title = r ? 'עריכת דיווח ' + r.id : 'דיווח שעות חדש';

      field('result', 'תוצר / תוצאה', area('result', 'rows="2"'), { req: true, full: true }) +
      field('learn', 'למידה או קושי', area('learn', 'rows="2"'), { full: true }) +

  function prefillPract(form, r) {
    if (!r) return;
    form.task.value = r.task.replace(/^טיוטה — /, '');
  }
  function submitPract(form, mode) {
    clearErrs(form);
    var ok = true, f = form;
    if (mode === 'draft') {
      if (!f.task.value.trim() && !f.date.value) { setErr(f, 'task', 'לשמירת טיוטה יש למלא לפחות תאריך או תיאור'); ok = false; }
    } else {
      if (!f.assign.value) { setErr(f, 'assign', 'יש לבחור שיבוץ'); ok = false; }
      if (!f.date.value) { setErr(f, 'date', 'יש לבחור תאריך'); ok = false; }
      if (!f.place.value.trim()) { setErr(f, 'place', 'יש למלא מקום ביצוע'); ok = false; }
      if (!f.start.value) { setErr(f, 'start', 'יש למלא שעת התחלה'); ok = false; }
      if (!f.end.value) { setErr(f, 'end', 'יש למלא שעת סיום'); ok = false; }
      if (f.task.value.trim().length < 10) { setErr(f, 'task', 'נא לתאר את המשימה (10 תווים לפחות)'); ok = false; }
      if (!f.result.value.trim()) { setErr(f, 'result', 'יש לתאר את התוצר'); ok = false; }
    }
    if (f.date.value && f.date.value > S.today) { setErr(f, 'date', 'לא ניתן לדווח על תאריך עתידי'); ok = false; }
    var brk = +f.brk.value || 0;
    if (brk < 0) { setErr(f, 'brk', 'ההפסקה לא יכולה להיות שלילית'); ok = false; }
    var net = 0;
    if (f.start.value && f.end.value) {
      if (toMin(f.end.value) <= toMin(f.start.value)) { setErr(f, 'end', 'שעת הסיום חייבת להיות אחרי שעת ההתחלה'); ok = false; }
      else { net = toMin(f.end.value) - toMin(f.start.value) - brk; if (net <= 0) { setErr(f, 'brk', 'ההפסקה ארוכה ממשך הדיווח'); ok = false; } }
    }
    if (!ok) { focusFirstErr(f); return; }
    var hours = Math.round(net / 30) / 2;
    var p = S.practicum;
    var existing = ui.practForm.editId ? p.reports.filter(function (x) { return x.id === ui.practForm.editId; })[0] : null;
    var rep = existing || { id: 'PR-' + (ui.seq.pr++) };
    var wasPending = existing && existing.status === 'pending';
    rep.date = f.date.value ? isoToDM(f.date.value) : '—';
    rep.hours = hours || rep.hours || 0;
    rep.task = (mode === 'draft' ? 'טיוטה — ' : '') + (f.task.value.trim() || 'ללא תיאור');
    var prevStatus = rep.status;
    rep.status = mode === 'draft' ? 'draft' : 'pending';
    if (mode === 'send') { delete rep.feedback; if (!wasPending) { p.pending += rep.hours; if (prevStatus !== 'returned') p.reported += rep.hours; } }
    if (!existing) p.reports.unshift(rep);
    if (mode === 'send' && S.nextAction.screen === 'practicum' && prevStatus === 'returned') {
      S.nextAction = { title: 'הגשת תיקון למסמך הארכיטקטורה', detail: 'גרסה 2 הוחזרה — חסר תרשים זרימת נתונים.', cta: 'למסך הפרויקט', screen: 'project', urgency: 'normal' };
    }
    ui.practForm = null;
    render();
    toast(mode === 'draft' ? 'הטיוטה נשמרה (' + rep.id + ')' : 'הדיווח נשלח לבדיקה! מספר: ' + rep.id + ' · ' + rep.hours + ' ש׳');
  }

    var h = '<div class="page-head"><div><h2 id="page-title" tabindex="-1">תור פניות</h2><p>' + S.requestQueue.filter(function (r) { return !r.owner; }).length + ' פניות ללא אחראית</p></div></div>';
    h += '<div class="filters" role="group" aria-label="סינון פניות">' +
      '<div class="field" style="flex:1;min-width:160px"><label for="f-rqq">חיפוש</label><input class="input" id="f-rqq" type="search" data-rfilter="q" value="' + esc(f.q) + '" placeholder="מספר, שם או נושא"></div>' +
      '<div class="field"><label for="f-rqs">סטטוס</label>' + sel('rqs', [{ v: 'all', t: 'הכל' }].concat(Object.keys(S.requestStatus).map(function (k) { return { v: k, t: S.requestStatus[k].replace('תשובתך', 'תשובת התלמידה') }; })), f.status).replace('<select', '<select data-rfilter="status"') + '</div>' +
      '<div class="field"><label for="f-rqt">סוג</label>' + sel('rqt', [{ v: 'all', t: 'הכל' }].concat(uniq(S.requestQueue.map(function (r) { return r.type; }))), f.type).replace('<select', '<select data-rfilter="type"') + '</div>' +
      '<div class="field"><label for="f-rqo">אחראית</label>' + sel('rqo', [{ v: 'all', t: 'הכל' }, { v: 'none', t: 'ללא אחראית' }, { v: 'mine', t: 'שלי' }], f.owner).replace('<select', '<select data-rfilter="owner"') + '</div></div>';
    h += '<p class="muted small mt" aria-live="polite">מוצגות ' + list.length + ' פניות</p><div class="stack">' + (list.length ? list.map(function (r) {
      var un = !r.owner;
      return '<article class="card" style="' + (un ? 'border-inline-start:6px solid var(--coral);background:#FFF8F4' : '') + '"><div class="row" style="justify-content:space-between"><span class="small muted">' + esc(r.id) + ' · ' + esc(r.type) + ' · ' + esc(r.source) + ' · ' + esc(r.updated) + '</span><div class="row">' +
        (un ? pill('p-peach', '🙋', 'ללא אחראית') : '') + (r.sensitive ? pill('p-gray', '🔒', 'רגישה') : '') + (r.priority === 'גבוהה' ? pill('p-bad', '▲', 'עדיפות גבוהה') : '') + reqPill(r.status) + '</div></div>' +
        '<h3 style="margin:6px 0 2px">' + esc(r.sensitive ? 'פנייה מוגבלת' : r.subject) + '</h3><p class="small muted">' + esc(r.student) + '</p>' +
        '<div class="row mt" style="align-items:flex-end">' +
        '<div class="field"><label for="ow-' + r.id + '" class="small">אחראית</label>' + selRaw('ow-' + r.id, ownerOptions(), r.owner || '', 'data-rq="owner" data-id="' + r.id + '"') + '</div>' +
        '<div class="field"><label for="pr-' + r.id + '" class="small">עדיפות</label>' + selRaw('pr-' + r.id, ['רגילה', 'גבוהה'], r.priority, 'data-rq="priority" data-id="' + r.id + '"') + '</div>' +
        '<div class="field"><label for="ss-' + r.id + '" class="small">סטטוס</label>' + selRaw('ss-' + r.id, Object.keys(S.requestStatus).map(function (k) { return { v: k, t: S.requestStatus[k].replace('תשובתך', 'תשובת התלמידה') }; }), r.status, 'data-rq="status" data-id="' + r.id + '"') + '</div>' +
        '<span class="spacer"></span><a class="btn sm" href="#admin/requests/' + esc(r.id) + '">פתיחה</a></div></article>';
    }).join('') : '<div class="card empty"><span class="emoji" aria-hidden="true">🔍</span>אין פניות לפי הסינון</div>') + '</div>';
    return h;
  }
  function selRaw(id, options, value, attrs) {
    return '<select class="input" id="' + id + '" ' + attrs + '>' + options.map(function (o) {
      var v = typeof o === 'string' ? o : o.v, t = typeof o === 'string' ? o : o.t;
      return '<option value="' + esc(v) + '"' + (v === value ? ' selected' : '') + '>' + esc(t) + '</option>';
    }).join('') + '</select>';
  }
  function adminThread(r) {
    var shared = S.requests.filter(function (x) { return x.id === r.id; })[0];
    if (shared) return threadFor(shared);
    if (!r.thread) r.thread = [{ who: 'me', text: r.subject, at: r.updated }];
    return r.thread;
  }
  function aRequestView(r) {
    var h = '<p><a href="#admin/requests">→ חזרה לתור הפניות</a></p><div class="page-head"><div><h2 id="page-title" tabindex="-1">' + esc(r.sensitive ? 'פנייה מוגבלת' : r.subject) + '</h2><p>' + esc(r.id) + ' · ' + esc(r.student) + ' · ' + esc(r.type) + ' · אחראית: ' + esc(r.owner || 'ללא') + '</p></div>' + reqPill(r.status) + '</div>';
    if (r.sensitive) {
      return h + '<section class="card restricted"><div style="font-size:2.4rem" aria-hidden="true">🔒</div><h3>תוכן מוגבל</h3><p>פנייה זו מסווגת כרגישה. התוכן, השרשור וההערות זמינים רק ל״' + esc(r.owner) + '״.</p><p class="small muted mt">הגישה שלך מתועדת בהיסטוריית הפעולות.</p></section>';
    }
    var t = adminThread(r);
    h += '<div class="grid grid-2"><section class="card" aria-labelledby="th-t" style="background:var(--surface-2)"><h3 id="th-t">💬 שיחה עם התלמידה</h3><div class="thread">' + t.map(function (m) {
      if (m.who === 'sys') return '<div class="msg sys">— ' + esc(m.text) + ' —</div>';
      return m.who === 'me' ? '<div class="msg them"><span class="who">' + esc(r.student) + (m.at ? ' · ' + esc(m.at) : '') + '</span>' + esc(m.text) + '</div>'
        : '<div class="msg me"><span class="who">' + esc(m.name || 'צוות') + (m.at ? ' · ' + esc(m.at) : '') + '</span>' + esc(m.text) + '</div>';
    }).join('') + '</div><form data-form="areply" novalidate class="mt">' + field('areply', 'תשובה לתלמידה', area('areply', 'rows="3"'), { req: true }) +
      '<label class="check"><input type="checkbox" name="await" checked> להעביר לסטטוס ״ממתינה לתשובת התלמידה״</label><div class="form-actions"><button class="btn" type="submit">שליחה לתלמידה</button></div></form></section>';
    h += '<section class="card internal" aria-labelledby="in-t"><h3 id="in-t">🔒 הערות פנימיות</h3><p class="pill p-warn" style="margin-bottom:10px">👁‍🗨 לא מוצג לתלמידה</p>' +
      ((r.notes || []).length ? r.notes.map(function (n) { return '<div class="note"><span class="who small">' + esc(n.by) + ' · ' + esc(n.at) + '</span><p>' + esc(n.text) + '</p></div>'; }).join('') : '<p class="small">אין עדיין הערות פנימיות.</p>') +
      '<form data-form="anote" novalidate class="mt">' + field('anote', 'הערה פנימית חדשה', area('anote', 'rows="3"'), { req: true }) + '<div class="form-actions"><button class="btn soft" type="submit">שמירת הערה פנימית</button></div></form></section></div>';
    return h;
  }
  function submitAReply(form) {
    clearErrs(form);
    if (!form.areply.value.trim()) { setErr(form, 'areply', 'אי אפשר לשלוח תשובה ריקה'); focusFirstErr(form); return; }
    var r = S.requestQueue.filter(function (x) { return x.id === route.param; })[0];
    adminThread(r).push({ who: 'them', name: S.staffUser.name, text: form.areply.value.trim(), at: 'עכשיו' });
    if (form.await.checked) r.status = 'waiting_student';
    var shared = S.requests.filter(function (x) { return x.id === r.id; })[0];
    if (shared) { shared.status = r.status; shared.lastMsg = form.areply.value.trim(); }
    r.updated = 'עכשיו';
    render(); toast('התשובה נשלחה לתלמידה');
  }
  function submitANote(form) {
    clearErrs(form);
    if (!form.anote.value.trim()) { setErr(form, 'anote', 'ההערה ריקה'); focusFirstErr(form); return; }
    var r = S.requestQueue.filter(function (x) { return x.id === route.param; })[0];
    (r.notes = r.notes || []).push({ by: S.staffUser.name, at: 'עכשיו', text: form.anote.value.trim() });
    render(); toast('ההערה הפנימית נשמרה');
  }

  /* ---------- רינדור ---------- */
  var VIEWS = {
    student: { dashboard: viewDashboard, schedule: viewSchedule, attendance: viewAttendance, obligations: viewObligations, practicum: viewPracticum, project: viewProject, meetings: viewMeetings, requests: viewRequests },
    admin: { dashboard: aDashboard, students: aStudents, attendance: aAttendance, practicum: aPracticum, meetings: aMeetings, requests: aRequests }
  };
  function render() {
    renderNav();
    main.innerHTML = VIEWS[route.role][route.screen]();
    namedFields(main);
    var title = NAV.filter(function (n) { return n.id === route.screen; })[0];
    document.title = (title ? title.label + ' · ' : '') + 'שנה ג׳ — ' + (route.role === 'admin' ? 'ניהול' : 'אזור התלמידה');
    if (route.role === 'student' && route.screen === 'practicum' && ui.practForm && ui.practForm.editId) {
      prefillPract(main.querySelector('form[data-form=pract]'), S.practicum.reports.filter(function (x) { return x.id === ui.practForm.editId; })[0]);
    }
    if (route.role === 'admin' && route.screen === 'meetings') { var af = main.querySelector('form[data-form=avail]'); if (af) updateAvailPreview(af); }
  }
  function onRoute() {
    var prev = route;
    route = parseHash();
    if (route.role === 'admin' && route.screen === 'requests' && route.query.f === 'unassigned') ua.rq = { status: 'all', type: 'all', owner: 'none', q: '' };
    if (route.screen === 'students' && route.param && (prev.param !== route.param)) ua.fileTab = 'details';
    closeModal();
    document.body.setAttribute('data-role', route.role);
    renderHeader();
    render();
    window.scrollTo(0, 0);
    if (route.query.f === 'failures') { var fs = document.getElementById('failures'); if (fs) { fs.scrollIntoView({ block: 'center' }); fs.focus({ preventScroll: true }); return; } }
    var t = document.getElementById('page-title');
    if (t) t.focus({ preventScroll: true });
  }

  /* ---------- אירועים ---------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var a = el.getAttribute('data-action'), id = el.getAttribute('data-id');
    switch (a) {
      case 'close-modal': closeModal(); break;
      case 'close-modal-link': closeModal(); break;
      case 'more': openMore(); break;
      /* תלמידה */
      case 'mode': ui.schedMode = el.getAttribute('data-v'); render(); focusSel('[data-action=mode][data-v="' + ui.schedMode + '"]'); break;
      case 'zoom': toast('פותחים את הזום… (הדגמה — אין קישור אמיתי)'); break;
      case 'correction': openCorrection(+el.getAttribute('data-i')); break;
      case 'pract-new': ui.practForm = { editId: null }; render(); scrollToEl('pract-form-card'); break;
      case 'pract-edit': ui.practForm = { editId: id }; render(); scrollToEl('pract-form-card'); break;
      case 'pract-cancel': ui.practForm = null; render(); break;
      case 'proj-new': ui.projForm = true; render(); scrollToEl('proj-form-card'); break;
      case 'proj-cancel': ui.projForm = false; render(); break;
      case 'meet-type': ui.meet.typeId = id; render(); focusSel('[data-action=meet-type][data-id="' + id + '"]'); break;
      case 'meet-next': ui.meet.step = 'slot'; ui.meet.slotId = null; render(); focusSel('#book-t'); break;
      case 'meet-slot': ui.meet.slotId = id; render(); focusSel('[data-action=meet-slot][data-id="' + id + '"]'); break;
      case 'meet-sum': ui.meet.step = 'summary'; render(); focusSel('[data-action=meet-confirm]'); break;
      case 'meet-back': ui.meet.step = el.getAttribute('data-to'); render(); break;
      case 'meet-confirm': confirmMeeting(); break;
      case 'meet-restart': ui.meet = { step: 'type', typeId: null, slotId: null, result: null }; render(); break;
      case 'req-new': ui.reqForm = true; render(); focusSel('#f-rtype'); break;
      case 'req-new-link': ui.reqForm = true; break;
      case 'req-cancel': ui.reqForm = false; render(); break;
      /* ניהול */
      case 'retry': retryFailure(el, id); break;
      case 'stu-add': openAddStudent(); break;
      case 'stu-import': openImport(); break;
      case 'import-confirm': confirmImport(); break;
      case 'stu-invite': openInvite(); break;
      case 'file-tab': ua.fileTab = id; render(); focusSel('#tab-' + id); break;
      case 'att-all': {
        var f = main.querySelector('form[data-form=att]'), d = attDataFor(ua.attSession), cur = attSessions().filter(function (s) { return s.id === ua.attSession; })[0];
        readAttForm(f, d);
        d.entries.forEach(function (x) { if (x.status === 'unreported') { x.status = 'present'; x.minutes = cur.mins; } });
        render(); toast('סומנו כנוכחות — יש ללחוץ ״אישור נוכחות״ לשמירה'); break;
      }
      case 'corr': openCorrDecision(id, el.getAttribute('data-v')); break;
      case 'pr-open': openPrReview(id); break;
      case 'mout': {
        var m = S.meetingsToday[+el.getAttribute('data-i')], v = el.getAttribute('data-v');
        m.outcome = v; render(); focusSel('[data-action=mout][data-i="' + el.getAttribute('data-i') + '"][data-v="' + v + '"]');
        toast('נרשמה תוצאה: ' + m.student + ' — ' + v); break;
      }
      case 'msync': {
        var mm = S.meetingsToday[+el.getAttribute('data-i')];
        mm.sync = 'pending'; render();
        setTimeout(function () { mm.sync = 'ok'; if (route.role === 'admin' && route.screen === 'meetings') render(); toast('הפגישה של ' + mm.student + ' סונכרנה ליומן Google'); }, 1200);
        break;
      }
    }
  });
  function focusSel(s) { var el = main.querySelector(s); if (el) { if (!el.hasAttribute('tabindex') && /^H\d$/.test(el.tagName)) el.setAttribute('tabindex', '-1'); el.focus(); } }
  function scrollToEl(id) { var el = document.getElementById(id); if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); var f = el.querySelector('select,input,textarea'); if (f) f.focus({ preventScroll: true }); } }

  /* ניווט בחצים בין לשוניות תיק התלמידה */
  document.addEventListener('keydown', function (e) {
    var tab = e.target.closest && e.target.closest('[role=tab]');
    if (!tab || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
    var ids = FILE_TABS.map(function (t) { return t[0]; }), i = ids.indexOf(ua.fileTab);
    i = (i + (e.key === 'ArrowLeft' ? 1 : -1) + ids.length) % ids.length; /* RTL: שמאלה = הבא */
    ua.fileTab = ids[i]; render(); focusSel('#tab-' + ids[i]); e.preventDefault();
  });

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.getAttribute('data-afilter') === 'q') { ua.stu.q = t.value; refreshStudentList(); }
    else if (t.getAttribute('data-rfilter') === 'q') { ua.rq.q = t.value; var pos = t.selectionStart; render(); var n = document.getElementById('f-rqq'); n.focus(); n.setSelectionRange(pos, pos); }
    else if (t.form && t.form.getAttribute('data-form') === 'avail') updateAvailPreview(t.form);
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    var f = t.getAttribute && t.getAttribute('data-filter');
    var af = t.getAttribute && t.getAttribute('data-afilter');
    var rf = t.getAttribute && t.getAttribute('data-rfilter');
    var rq = t.getAttribute && t.getAttribute('data-rq');
    if (f === 'course') { ui.schedCourse = t.value; render(); focusSel('[data-filter=course]'); }
    else if (f === 'cancelled') { ui.schedCancelled = t.checked; render(); focusSel('[data-filter=cancelled]'); }
    else if (af === 'asess') { ua.attSession = t.value; render(); focusSel('#f-asess'); }
    else if (af && af !== 'q') { ua.stu[af] = t.value; refreshStudentList(); }
    else if (rf && rf !== 'q') { ua.rq[rf] = t.value; render(); focusSel('[data-rfilter=' + rf + ']'); }
    else if (rq) {
      var r = S.requestQueue.filter(function (x) { return x.id === t.getAttribute('data-id'); })[0];
      var wasUn = !r.owner;
      r[rq] = t.value || null;
      if (rq === 'owner' && wasUn && r.owner) kpiAdd('unassigned', -1);
      if (rq === 'owner' && !wasUn && !r.owner) kpiAdd('unassigned', 1);
      var shared = S.requests.filter(function (x) { return x.id === r.id; })[0];
      if (shared) { if (rq === 'owner') shared.owner = r.owner; if (rq === 'status') shared.status = r.status; }
      r.updated = 'עכשיו';
      render(); focusSel('#' + t.id);
      toast(r.id + ': ' + (rq === 'owner' ? 'שויכה ל' + (r.owner || 'ללא אחראית') : rq === 'priority' ? 'עדיפות ' + r.priority : 'סטטוס עודכן'));
    }
    else if (t.name === 'kind' && t.form && t.form.getAttribute('data-form') === 'proj') {
      t.form.link.disabled = t.value !== 'link';
      t.form.file.disabled = t.value !== 'file';
    }
  });

  var lastSubmitter = null;
  document.addEventListener('click', function (e) { var b = e.target.closest('button[type=submit]'); if (b) lastSubmitter = b; }, true);
  document.addEventListener('submit', function (e) {
    var form = e.target, kind = form.getAttribute('data-form');
    if (!kind) return;
    e.preventDefault();
    var sub = (e.submitter || lastSubmitter);
    var mode = sub && sub.getAttribute('data-submit');
    var H = {
      correction: submitCorrection, proj: submitProj, req: submitReq, reply: submitReply,
      'stu-add': submitAddStudent, invite: submitInvite, att: submitAtt, corr: submitCorr, avail: submitAvail, areply: submitAReply, anote: submitANote
    };
    if (kind === 'pract') submitPract(form, mode || 'send');
    else if (kind === 'pr') submitPr(form, mode || 'approved');
    else if (H[kind]) H[kind](form);
  });

  window.addEventListener('hashchange', onRoute);
  if (!location.hash) { try { history.replaceState(null, '', '#student/dashboard'); } catch (err) { /* file:// ללא היסטוריה */ } }
  onRoute();
})();
</script>
</body>
</html>
