<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מערכת שנה ג׳ — קלאסי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6fa; --surface:#fff; --surface-2:#f9fafc; --border:#e1e5ee; --border-strong:#cbd2df;
  --text:#1b2332; --muted:#566074; --faint:#7a8396;
  --primary:#3346b0; --primary-d:#25348a; --primary-l:#eef0fb;
  --side:#1c2552; --side-2:#262f63; --side-t:#cfd5f0;
  --ok:#17663f; --ok-bg:#e3f3ea; --warn:#7f5200; --warn-bg:#fcf0d4;
  --bad:#a8202c; --bad-bg:#fbe6e8; --info:#1c579b; --info-bg:#e5eefa; --neu:#475066; --neu-bg:#eceff4;
  --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
  --side-w:248px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Assistant","Heebo",Arial,sans-serif;font-size:16px;line-height:1.5;color:var(--text);background:var(--bg);overflow-x:hidden}
a{color:var(--primary)}
h1,h2,h3{margin:0;line-height:1.25}
h1{font-size:1.6rem;font-weight:800}
h2{font-size:1.1rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:.25rem 0}
:focus-visible{outline:3px solid #6b7cf0;outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;top:-40px;right:8px;background:var(--primary);color:#fff;padding:6px 12px;border-radius:6px;z-index:100}
.skip:focus{top:8px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}

/* ---------- Sidebar ---------- */
.sidebar{position:fixed;top:0;right:0;bottom:0;width:var(--side-w);background:var(--side);color:var(--side-t);display:flex;flex-direction:column;z-index:40;transition:transform .2s}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand-mark{width:36px;height:36px;border-radius:9px;background:#5466d6;color:#fff;display:grid;place-items:center;font-weight:800}
.brand b{display:block;color:#fff;font-size:1rem}
.brand small{font-size:.8rem;color:#a9b2dc}
.nav{padding:12px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1}
.nav-label{font-size:.75rem;letter-spacing:.03em;color:#8e98c6;padding:10px 12px 4px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;color:var(--side-t);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--side-2);color:#fff}
.nav a[aria-current="page"]{background:#3a4592;color:#fff;font-weight:700;box-shadow:inset -3px 0 0 #a7b3ff}
.nav .count{margin-inline-start:auto;background:#f0b429;color:#2b1d00;font-size:.75rem;font-weight:700;border-radius:999px;padding:0 8px}
.side-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:.88rem;display:flex;flex-direction:column;gap:6px}
.side-foot a{color:#c6cdf2;text-decoration:none;display:flex;gap:8px;align-items:center}
.side-foot a:hover{color:#fff;text-decoration:underline}
.overlay{display:none;position:fixed;inset:0;background:rgba(10,15,35,.45);z-index:35}

/* ---------- Top bar ---------- */
.main{margin-right:var(--side-w);min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--border);height:62px;display:flex;align-items:center;gap:14px;padding:0 24px}
.hamburger{display:none}
.search{flex:1;max-width:420px;position:relative}
.search input{width:100%;height:38px;border:1px solid var(--border);background:var(--surface-2);border-radius:8px;padding:0 38px 0 12px;font:inherit}
.search svg{position:absolute;right:11px;top:10px;color:var(--faint)}
.top-actions{margin-inline-start:auto;display:flex;align-items:center;gap:14px}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:9px;padding:3px;background:var(--surface-2)}
.seg a{padding:5px 14px;border-radius:7px;text-decoration:none;color:var(--muted);font-weight:700;font-size:.9rem}
.seg a:hover{color:var(--primary)}
.seg a[aria-current="true"]{background:var(--primary);color:#fff}
.user{display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.9rem;flex:none}
.avatar.lg{width:56px;height:56px;font-size:1.2rem}
.user-meta{line-height:1.15}
.user-meta b{display:block;font-size:.92rem}
.user-meta small{color:var(--muted);font-size:.8rem}

/* ---------- Content ---------- */
.content{padding:24px;max-width:1240px;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-head p{color:var(--muted)}
.crumbs{font-size:.88rem;color:var(--muted);margin-bottom:4px}
.crumbs a{text-decoration:none}
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.span-2{grid-column:span 2}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h2{display:flex;align-items:center;gap:8px}
.card-h h2 svg{color:var(--primary)}
.card-link{display:block;color:inherit;text-decoration:none;transition:border-color .15s,box-shadow .15s}
.card-link:hover{border-color:#aab4e6;box-shadow:0 4px 14px rgba(51,70,176,.12)}
.more{font-size:.88rem;font-weight:600;color:var(--primary);white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.big-num{font-size:2.1rem;font-weight:800;line-height:1}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;font-size:.95rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}
.list{list-style:none;margin:0;padding:0}
.list li{padding:10px 0;border-bottom:1px solid var(--border)}
.list li:last-child{border-bottom:0}
hr.sep{border:0;border-top:1px solid var(--border);margin:14px 0}

/* Next action */
.next-action{display:flex;gap:16px;align-items:center;border-inline-start:5px solid var(--bad);background:linear-gradient(90deg,#fff, #fff7f7)}
.next-action .na-icon{width:48px;height:48px;border-radius:12px;background:var(--bad-bg);color:var(--bad);display:grid;place-items:center;flex:none}
.next-action .na-icon svg{width:26px;height:26px}
.next-action .eyebrow{font-size:.8rem;font-weight:700;color:var(--bad);letter-spacing:.02em}
.next-action.calm{border-inline-start-color:var(--primary);background:#fff}
.next-action.calm .na-icon{background:var(--primary-l);color:var(--primary)}
.next-action.calm .eyebrow{color:var(--primary)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 16px;border-radius:8px;border:1px solid var(--primary);background:var(--primary);color:#fff;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--primary-d)}
.btn.secondary{background:#fff;color:var(--primary);border-color:var(--border-strong)}
.btn.secondary:hover{background:var(--primary-l)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--primary)}
.btn.ghost:hover{background:var(--primary-l)}
.btn.danger{background:var(--bad);border-color:var(--bad)}
.btn.ok{background:var(--ok);border-color:var(--ok)}
.btn.sm{height:32px;padding:0 10px;font-size:.88rem}
.btn[disabled],.btn[aria-disabled="true"]{background:#e6e9f0;border-color:#d6dbe5;color:#7d8597;cursor:not-allowed}
.icon-btn{width:38px;height:38px;border-radius:8px;border:1px solid var(--border);background:#fff;display:inline-grid;place-items:center;cursor:pointer;color:var(--text)}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.82rem;font-weight:700;padding:2px 10px 2px 9px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.pill svg.i{width:14px;height:14px;stroke-width:2.5}
.pill-ok{background:var(--ok-bg);color:var(--ok);border-color:#bfe2cd}
.pill-warn{background:var(--warn-bg);color:var(--warn);border-color:#f0d48f}
.pill-bad{background:var(--bad-bg);color:var(--bad);border-color:#f2bcc2}
.pill-info{background:var(--info-bg);color:var(--info);border-color:#bcd3f0}
.pill-neu{background:var(--neu-bg);color:var(--neu);border-color:#d5dae4}
.pill-pri{background:var(--primary-l);color:var(--primary);border-color:#c9cff3}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:.82rem;color:var(--neu);background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:1px 8px}
.tag svg.i{width:14px;height:14px}

/* Tables */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:#fff}
table{width:100%;border-collapse:collapse;font-size:.94rem}
th,td{padding:11px 14px;text-align:right;vertical-align:middle;border-bottom:1px solid var(--border)}
th{background:#f1f3f8;color:var(--muted);font-weight:700;font-size:.84rem;white-space:nowrap}
tbody tr:nth-child(even){background:#fafbfd}
tbody tr:last-child td{border-bottom:0}
tbody tr.clickable{cursor:pointer}
tbody tr.clickable:hover{background:#eef1fb}
tr.hl{background:#fffaf0!important}
td.num{font-variant-numeric:tabular-nums}
.sub-line{display:block;font-size:.84rem;color:var(--muted);margin-top:2px}
.feedback{margin-top:6px;font-size:.88rem;background:var(--warn-bg);border:1px solid #f0d48f;border-radius:6px;padding:6px 10px;color:#5a3c00}
.feedback b{color:var(--warn)}

/* Progress */
.progress{height:12px;background:#e7eaf2;border-radius:999px;overflow:hidden;display:flex}
.progress span{display:block;height:100%}
.progress .p-ok{background:var(--ok)}
.progress .p-pend{background:repeating-linear-gradient(45deg,#7fa6dd 0 6px,#a9c4ea 6px 12px)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}

/* Forms */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.form-grid .full{grid-column:1/-1}
.field label,.field .lbl{display:block;font-weight:600;font-size:.92rem;margin-bottom:4px}
.req{color:var(--bad)}
.field input[type=text],.field input[type=date],.field input[type=time],.field input[type=number],.field input[type=url],.field input[type=email],.field select,.field textarea,.filters select,.filters input[type=search]{width:100%;font:inherit;border:1px solid var(--border-strong);border-radius:8px;padding:8px 10px;background:#fff;color:var(--text);min-height:40px}
.field textarea{min-height:84px;resize:vertical}
.field input[type=file]{font:inherit;font-size:.9rem;max-width:100%}
.field [aria-invalid="true"]{border-color:var(--bad);background:#fff8f8}
.hint{font-size:.82rem;color:var(--muted);margin-top:3px}
.err{font-size:.85rem;color:var(--bad);font-weight:600;margin-top:3px;min-height:0}
.err:not(:empty)::before{content:"⚠ "}
.form-actions{display:flex;gap:10px;justify-content:flex-start;flex-wrap:wrap;margin-top:16px}
.radio-row{display:flex;gap:16px;flex-wrap:wrap}
.radio-row label{font-weight:500;display:flex;align-items:center;gap:6px}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.filters .field{min-width:160px}
.check{display:flex;align-items:center;gap:8px;font-weight:600;min-height:40px}
.check input{width:18px;height:18px}

/* Schedule */
.week-h{font-size:.95rem;font-weight:700;color:var(--muted);margin:18px 0 8px}
.session{display:grid;grid-template-columns:78px 1fr auto;gap:14px;align-items:center;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.session .date{text-align:center;border-inline-end:1px solid var(--border);padding-inline-end:12px}
.session .date b{display:block;font-size:1.25rem}
.session .date small{color:var(--muted)}
.session .time{font-weight:700;font-variant-numeric:tabular-nums}
.session .meta{display:flex;gap:8px 14px;flex-wrap:wrap;color:var(--muted);font-size:.9rem;margin-top:4px}
.session .meta span{display:inline-flex;align-items:center;gap:4px}
.session.updated{border-inline-start:4px solid var(--warn)}
.session.cancelled{background:#f7f7f9;border-style:dashed;border-inline-start:4px solid var(--bad)}
.session.cancelled .strike{text-decoration:line-through;color:var(--faint)}
.change-note{margin-top:6px;font-size:.88rem;font-weight:600}
.change-note.u{color:var(--warn)}
.change-note.c{color:var(--bad)}

/* Stepper */
.stepper{display:flex;list-style:none;margin:0;padding:0;counter-reset:st}
.stepper li{flex:1;position:relative;text-align:center;padding-top:44px;font-size:.9rem;font-weight:600}
.stepper li::before{content:"";position:absolute;top:17px;right:50%;left:-50%;height:3px;background:#d8dde8;z-index:0}
.stepper li:first-child::before{display:none}
.stepper li.done::before,.stepper li.current::before{background:var(--ok)}
.stepper .dot{position:absolute;top:0;right:50%;transform:translateX(50%);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid #cdd3df;color:var(--faint);z-index:1}
.stepper li.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.stepper li.current .dot{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 0 0 5px var(--primary-l)}
.stepper .st-state{display:block;font-size:.78rem;font-weight:500;color:var(--muted)}
.stepper li.locked{color:var(--faint)}

/* Callouts */
.callout{border-radius:8px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:.94rem}
.callout svg{margin-top:2px}
.callout.warn{background:var(--warn-bg);border:1px solid #f0d48f;color:#5a3c00}
.callout.bad{background:var(--bad-bg);border:1px solid #f2bcc2;color:#7a1820}
.callout.info{background:var(--info-bg);border:1px solid #bcd3f0;color:#123f73}
.callout.ok{background:var(--ok-bg);border:1px solid #bfe2cd;color:#0f4a2d}

/* Meetings */
.choice{display:block;border:1px solid var(--border-strong);border-radius:var(--radius);padding:12px 14px;cursor:pointer;background:#fff;text-align:right;font:inherit;width:100%}
.choice:hover{border-color:var(--primary)}
.choice[aria-pressed="true"]{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary) inset;background:var(--primary-l)}
.choice[disabled]{cursor:not-allowed;background:#f4f5f8;color:var(--faint);border-style:dashed}
.cond{display:flex;gap:8px;align-items:flex-start;padding:6px 0}
.cond .mark{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800;font-size:.8rem}
.cond.ok .mark{background:var(--ok-bg);color:var(--ok)}
.cond.no .mark{background:var(--bad-bg);color:var(--bad)}
.steps-mini{display:flex;gap:6px;font-size:.85rem;color:var(--muted);margin-bottom:14px;flex-wrap:wrap}
.steps-mini span{padding:3px 10px;border-radius:999px;background:var(--neu-bg)}
.steps-mini span.on{background:var(--primary);color:#fff;font-weight:700}

/* Thread */
.thread{display:flex;flex-direction:column;gap:12px}
.msg{max-width:78%;border:1px solid var(--border);border-radius:12px;padding:10px 14px;background:#fff}
.msg.me{align-self:flex-start;background:var(--primary-l);border-color:#cdd3f3}
.msg.staff{align-self:flex-end}
.msg .who{font-size:.82rem;color:var(--muted);font-weight:600;margin-bottom:2px}

/* Modal & toast */
.modal-back{position:fixed;inset:0;background:rgba(15,20,40,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:60}
.modal-back.open{display:flex}
.modal{background:#fff;border-radius:12px;width:100%;max-width:560px;max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-b{padding:18px 20px}
.toasts{position:fixed;bottom:20px;left:20px;display:flex;flex-direction:column;gap:8px;z-index:80;max-width:calc(100vw - 40px)}
.toast{background:#17213f;color:#fff;border-radius:10px;padding:12px 16px;box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;gap:10px;align-items:center;min-width:260px;border-inline-start:5px solid #43c27f}
.toast.err{border-inline-start-color:#ff6b78}

/* ---------- Admin additions ---------- */
.avatar.staff{background:#0f6e66}
.kpi{padding:16px}
.kpi .kpi-l{font-weight:600;color:var(--muted);font-size:.92rem;display:flex;align-items:center;gap:6px}
.kpi .kpi-v{font-size:2rem;font-weight:800;line-height:1.1;margin:8px 0 2px}
.kpi .kpi-t{font-size:.85rem;color:var(--muted)}
.kpi.alert{border-color:#f2bcc2;border-inline-start:4px solid var(--bad)}
.kpi.alert .kpi-t{color:var(--bad);font-weight:700}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto}
.tabs a{padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a:hover{color:var(--primary)}
.tabs a[aria-current="page"]{color:var(--primary);border-bottom-color:var(--primary)}
.internal{background:#fffbea;border:2px dashed #c99700;border-radius:var(--radius);padding:16px}
.internal-h{display:flex;align-items:center;gap:8px;color:#5e4500;font-weight:800;flex-wrap:wrap}
.note{background:#fff;border:1px solid #ecd58a;border-radius:8px;padding:8px 12px;margin-top:8px;font-size:.92rem}
.restricted{text-align:center;padding:36px 20px;background:repeating-linear-gradient(135deg,#f6f7fa 0 10px,#eef0f5 10px 20px);border:1px dashed var(--border-strong);border-radius:var(--radius)}
.restricted svg.i{width:36px;height:36px;color:var(--neu)}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty b{display:block;color:var(--text);margin-bottom:4px}
.flash{animation:flash 2s}
@keyframes flash{0%,50%{box-shadow:0 0 0 4px #f0b429}100%{box-shadow:var(--shadow)}}
td select,td input[type=number]{font:inherit;border:1px solid var(--border-strong);border-radius:6px;padding:4px 8px;min-height:34px;background:#fff}
td input[type=number]{width:88px}
.filter-banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.check-list label{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)}

/* Responsive */
@media (max-width:1100px){.g-4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:800px){
  .sidebar{transform:translateX(100%)}
  body.nav-open .sidebar{transform:none}
  body.nav-open .overlay{display:block}
  .main{margin-right:0}
  .hamburger{display:inline-grid}
  .topbar{padding:0 12px;gap:10px}
  .user-meta{display:none}
  .seg a{padding:5px 10px}
  .search{display:none}
  .tabs{overflow-x:auto}
  .content{padding:16px}
  .g-2,.g-3,.g-4{grid-template-columns:minmax(0,1fr)}
  .span-2{grid-column:auto}
  .form-grid{grid-template-columns:minmax(0,1fr)}
  .session{grid-template-columns:62px 1fr}
  .session .actions{grid-column:1/-1}
  .next-action{flex-wrap:wrap}
  .stepper{flex-direction:column;gap:6px}
  .stepper li{text-align:right;padding:6px 48px 6px 0;min-height:40px}
  .stepper li::before{display:none}
  .stepper .dot{right:0;transform:none;top:2px}
  .msg{max-width:92%}
  h1{font-size:1.35rem}
}
</style>
</head>
<body>
<a class="skip" href="#view">דילוג לתוכן</a>

<aside class="sidebar" id="sidebar" aria-label="ניווט ראשי">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">ג׳</div>

/* ---------- Requests ---------- */
function getThread(r) {
  if (!S.threads[r.id]) {
    var t = [{ me: true, who: M.me.name, at: r.opened, text: "פנייה בנושא: " + r.subject }];
    if (r.status !== "new") t.push({ me: false, who: r.owner, at: r.opened, text: "הפנייה התקבלה ונמצאת בטיפול." });
    if (r.lastMsg) t.push({ me: false, who: r.owner, at: r.opened, text: r.lastMsg });
    if (r.status === "closed") t.push({ me: false, who: r.owner, at: r.opened, text: "הפנייה טופלה ונסגרה. ניתן לפתוח פנייה חדשה בכל עת." });
    S.threads[r.id] = t;
  }
  return S.threads[r.id];
}
screens.requests = function (rt) {
  if (rt.param) {

  return '<div class="page-head"><div><h1>פניות</h1><p>פניות למזכירות ולצוות. לחצי על פנייה לצפייה בשיחה.</p></div><button class="btn" data-act="rq-new">' + ico("plus") + "פנייה חדשה</button></div>" +

    M.requests.map(function (r) {

function requestThread(r) {

    (r.status === "waiting_student" ? '<div class="callout warn" style="margin-bottom:14px">' + ico("alert") + "<div><b>הצוות ממתין לתשובתך.</b> השיבי בטופס למטה.</div></div>" : "") +
    '<section class="card" aria-label="שרשור הפנייה"><div class="thread">' + t.map(function (m) { return '<div class="msg ' + (m.me ? "me" : "staff") + '"><div class="who">' + esc(m.who) + " · " + m.at + "</div>" + esc(m.text) + "</div>"; }).join("") + "</div>" +
    (r.status === "closed" ? '<p class="muted" style="margin-top:14px">הפנייה סגורה.</p>' :
      '<hr class="sep"><form id="replyForm" data-id="' + r.id + '" novalidate>' + field("תשובה", "rp_text", area("rp_text", 'rows="3" placeholder="כתבי את תשובתך"'), { req: true }) + '<div style="margin-top:10px">' + field("צרופה", "rp_file", inp("file", "rp_file")) + '</div><div class="form-actions"><button class="btn" type="submit">שליחה</button><a class="btn secondary" href="#student/requests">חזרה לרשימה</a></div></form>') + "</section>";

function afterRender(rt) {

document.addEventListener("click", function (e) {

  if (row && !e.target.closest("a,button")) { go(row.getAttribute("data-href")); return; }
  var b = e.target.closest("[data-act]"); if (!b) return;

    case "pr-new": e.preventDefault(); S.prEdit = null; render(); var c = $("#prFormCard"); if (c) { c.scrollIntoView({ behavior: "smooth" }); $("#f-pr_assign").focus({ preventScroll: true }); } break;
    case "pr-edit": S.prEdit = id; render(); $("#prFormCard").scrollIntoView({ behavior: "smooth" }); $("#f-pr_assign").focus({ preventScroll: true }); break;
    case "mt-type": S.mt.type = id; S.mt.slot = null; S.mt.step = "slot"; render(); break;

});
document.addEventListener("change", function (e) {
  var f = e.target.form;

});
document.addEventListener("submit", function (e) {

  if (f.id === "searchForm") return doSearch();
  if (f.id === "attFixForm") return submitAttFix(f);

});
document.addEventListener("keydown", function (e) { if (e.key === "Escape") { if ($("#modalBack").classList.contains("open")) closeModal(); else document.body.classList.remove("nav-open"); } });
$("#modalBack").addEventListener("click", function (e) { if (e.target === this) closeModal(); });
$("#hamburger").addEventListener("click", function () { var o = document.body.classList.toggle("nav-open"); this.setAttribute("aria-expanded", String(o)); if (o) $("#nav a").focus(); });
$("#overlay").addEventListener("click", function () { document.body.classList.remove("nav-open"); $("#hamburger").setAttribute("aria-expanded", "false"); });

/* ===================== Actions ===================== */
function doSearch() {
  var q = $("#q").value.trim(); if (!q) return;
  if (parseHash().role === "admin") return doSearchAdmin(q);
  var rq = M.requests.filter(function (r) { return r.id.toLowerCase() === q.toLowerCase() || r.subject.indexOf(q) > -1; })[0];
  if (rq) return go("requests/" + rq.id);
  var n = NAV.filter(function (x) { return x.label.indexOf(q) > -1; })[0];
  if (n) return go(n.id);
  var c = M.courses.filter(function (x) { return x.name.indexOf(q) > -1; })[0];
  if (c) { S.sched.course = c.name; go("schedule"); render(); return; }
  toast("לא נמצאו תוצאות עבור ״" + esc(q) + "״", true);
}

function submitAttFix(f) {
  clearErrs(f); var ok = true;
  if (!f.elements.af_req.value) { setErr(f, "af_req", "יש לבחור את הסטטוס המבוקש"); ok = false; }
  if (f.elements.af_text.value.trim().length < 10) { setErr(f, "af_text", "נא לכתוב הסבר של 10 תווים לפחות"); ok = false; }
  var file = f.elements.af_file.files[0];
  if (file && file.size > 5 * 1024 * 1024) { setErr(f, "af_file", "גודל הקובץ עולה על 5MB"); ok = false; }
  if (!ok) return focusFirstError(f);
  var row = M.attendance.rows[+f.elements.af_session.value], num = "AC-" + S.seq.ac++;
  row.status = "review"; row.correction = "בקשת תיקון #" + num + " — ממתינה להחלטה";
  closeModal(); render();
  toast("בקשת התיקון נשלחה. מספר מעקב: <b>" + num + "</b>");
}

function submitPracticum(f, mode) {
  clearErrs(f); var ok = true, v = function (n) { return f.elements[n].value.trim(); };
  var draft = mode === "draft";
  if (v("pr_date") && v("pr_date") > M.today) { setErr(f, "pr_date", "לא ניתן לדווח על תאריך עתידי"); ok = false; }
  if (v("pr_start") && v("pr_end") && toMin(v("pr_end")) <= toMin(v("pr_start"))) { setErr(f, "pr_end", "שעת הסיום חייבת להיות אחרי שעת ההתחלה"); ok = false; }
  var brk = +v("pr_break") || 0;
  if (brk < 0) { setErr(f, "pr_break", "ערך לא תקין"); ok = false; }
  if (draft) {
    if (!v("pr_date") && !v("pr_task")) { setErr(f, "pr_task", "לשמירת טיוטה יש למלא לפחות תאריך או תיאור משימה"); ok = false; }
  } else {
    var req = { pr_assign: "יש לבחור שיבוץ", pr_date: "יש להזין תאריך", pr_place: "יש להזין מקום", pr_start: "יש להזין שעת התחלה", pr_end: "יש להזין שעת סיום", pr_task: "יש לתאר את המשימה", pr_result: "יש לתאר את התוצר" };
    Object.keys(req).forEach(function (n) { if (!v(n)) { setErr(f, n, req[n]); ok = false; } });
  }
  var mins = 0;
  if (ok && v("pr_start") && v("pr_end")) {
    mins = toMin(v("pr_end")) - toMin(v("pr_start")) - brk;
    if (mins <= 0) { setErr(f, "pr_break", "זמן ההפסקה ארוך מטווח השעות"); ok = false; }
  }
  if (!ok) return focusFirstError(f);
  var hours = Math.round(mins / 60 * 10) / 10, P = M.practicum;
  var rep = S.prEdit ? P.reports.filter(function (r) { return r.id === S.prEdit; })[0] : null;
  if (!rep) { rep = { id: "PR-" + S.seq.pr++, status: "draft", hours: 0 }; P.reports.unshift(rep); }
  var wasCounted = rep.status === "returned" || rep.status === "pending";
  if (wasCounted) { P.reported -= rep.hours; if (rep.status === "pending") P.pending -= rep.hours; }
  rep.date = v("pr_date") ? isoToDM(v("pr_date")) : "—";
  rep.hours = hours; rep.task = v("pr_task") || "טיוטה";
  rep.status = draft ? "draft" : "pending"; delete rep.feedback;
  if (!draft) { P.reported += hours; P.pending += hours; }
  S.prEdit = null; render();
  toast(draft ? "הטיוטה " + rep.id + " נשמרה." : "הדיווח " + rep.id + " נשלח לבדיקת המלווה (" + hours + " שעות).");
}

function submitProject(f) {
  clearErrs(f); var ok = true, kind = f.querySelector('input[name="pj_kind"]:checked').value;
  if (!f.elements.pj_type.value) { setErr(f, "pj_type", "יש לבחור סוג תוצר"); ok = false; }
  if (!f.elements.pj_title.value.trim()) { setErr(f, "pj_title", "יש להזין כותרת לגרסה"); ok = false; }
  if (kind === "file" && !f.elements.pj_file.files.length) { setErr(f, "pj_file", "יש לבחור קובץ להעלאה"); ok = false; }
  if (kind === "link" && !/^https?:\/\/\S+\.\S+/.test(f.elements.pj_link.value.trim())) { setErr(f, "pj_link", "יש להזין קישור תקין שמתחיל ב-https://"); ok = false; }
  if (!ok) return focusFirstError(f);
  var subs = M.project.submissions, ver = subs.reduce(function (m, s) { return Math.max(m, s.version); }, 0) + 1;
  subs.unshift({ version: ver, title: f.elements.pj_type.value + " — " + f.elements.pj_title.value.trim(), submittedAt: fmtDM(TODAY) + " " + nowHM(), status: "pending", feedback: null });
  render(); toast("גרסה " + ver + " הוגשה בהצלחה ונשלחה למנחה.");
}

function confirmBooking() {
  var t = M.appointmentTypes.filter(function (x) { return x.id === S.mt.type; })[0], sl = M.slots.filter(function (x) { return x.id === S.mt.slot; })[0];
  var b = { id: "AP-" + S.seq.ap++, type: t.name, date: sl.date, time: sl.time, coach: sl.coach, sync: "ממתין לסנכרון" };
  sl.free -= 1; M.myAppointments.push(b); S.mt.booking = b; S.mt.step = "done"; render();
  toast("הפגישה נקבעה. מספר רישום: <b>" + b.id + "</b>");
  setTimeout(function () { b.sync = "סונכרן ליומן"; var el = $("#syncState"); if (el) el.innerHTML = syncPill(b.sync); var h = parseHash(); if (h.role === "student" && h.screen === "meetings") render(); }, 1600);
}

function openNewRequest() {
  openModal("פנייה חדשה", '<form id="newReqForm" novalidate><div class="form-grid">' +
    field("סוג פנייה", "nr_type", sel("nr_type", [{ v: "", l: "בחרי סוג" }, "מסמכים", "נוכחות", "לימודים", "פרקטיקום", "תשלומים", "טכני", "אחר"]), { req: true, full: true }) +
    field("נושא", "nr_subject", inp("text", "nr_subject", 'maxlength="80"'), { req: true, full: true }) +
    field("תוכן הפנייה", "nr_text", area("nr_text", 'rows="4"'), { req: true, full: true }) +
    field("צרופה", "nr_file", inp("file", "nr_file"), { full: true }) +
    '</div><div class="form-actions"><button class="btn" type="submit">שליחת הפנייה</button><button class="btn secondary" type="button" data-act="close-modal">ביטול</button></div></form>');
}
function submitNewRequest(f) {
  clearErrs(f); var ok = true;
  if (!f.elements.nr_type.value) { setErr(f, "nr_type", "יש לבחור סוג פנייה"); ok = false; }
  if (f.elements.nr_subject.value.trim().length < 3) { setErr(f, "nr_subject", "יש להזין נושא"); ok = false; }
  if (f.elements.nr_text.value.trim().length < 5) { setErr(f, "nr_text", "יש לפרט את הפנייה"); ok = false; }
  if (!ok) return focusFirstError(f);
  var r = { id: "RQ-" + S.seq.rq++, subject: f.elements.nr_subject.value.trim(), type: f.elements.nr_type.value, opened: fmtDM(TODAY), status: "new", owner: "טרם שויכה" };
  S.threads[r.id] = [{ me: true, who: M.me.name, at: r.opened, text: f.elements.nr_text.value.trim() }];
  M.requests.unshift(r); closeModal(); render();
  toast("הפנייה נשלחה. מספר פנייה: <b>" + r.id + "</b>");
}
function submitReply(f) {
  clearErrs(f);
  if (f.elements.rp_text.value.trim().length < 2) { setErr(f, "rp_text", "יש לכתוב תשובה"); return focusFirstError(f); }
  var r = M.requests.filter(function (x) { return x.id === f.getAttribute("data-id"); })[0];
  getThread(r).push({ me: true, who: M.me.name, at: fmtDM(TODAY) + " " + nowHM(), text: f.elements.rp_text.value.trim() });
  if (r.status === "waiting_student") r.status = "in_progress";
  render(); toast("התשובה נשלחה לצוות.");
}

      M.students.push({ id: ok.id, name: ok.name, email: ok.email, cohort: ok.cohort, track: ok.track, account: "הוזמנה", obligations: 0, attendance: null });
      A.seq.stu++; closeModal(); render(); toast("יובאה שורה 1. שורה אחת נדחתה (שגיאה) ושורה אחת דולגה (כפילות)."); break;
    case "a-invite": openInvite(); break;
    case "a-att-all": $all("[data-ati]").forEach(function (s, k) { s.value = "present"; var m = $("#atm-" + k); if (!m.value || m.value === "0") m.value = 180; }); toast("כל התלמידות סומנו כנוכחות. יש לאשר כדי לשמור."); break;
    case "a-att-approve":
      var vals = readAttendance(); if (!vals) { toast("יש לתקן שגיאות בטבלה.", true); return; }
      if (M.attendanceSession.approved) {
        A.pendingAtt = vals;
        openModal("דריסת נתונים מאושרים", '<div class="callout warn">' + ico("alert") + "<div>נוכחות המפגש <b>" + esc(M.attendanceSession.course + " " + M.attendanceSession.date) + "</b> כבר אושרה. שמירה תדרוס את הנתונים הקיימים. להמשיך?</div></div>" +
          '<div class="form-actions"><button class="btn danger" data-act="a-att-overwrite">כן, לדרוס ולשמור</button><button class="btn secondary" data-act="close-modal">ביטול</button></div>');
      } else applyAttendance(vals);
      break;
    case "a-att-overwrite": applyAttendance(A.pendingAtt); break;
    case "a-corr": openCorrDecision(id, b.getAttribute("data-v")); break;
    case "a-pr-open": openPracticumReview(id); break;
    case "a-out": M.meetingsToday[i].outcome = b.getAttribute("data-v"); render(); toast("התוצאה נרשמה: " + esc(b.getAttribute("data-v")) + "."); break;
    case "a-resync":
      b.disabled = true; b.textContent = "מסנכרן…";
      setTimeout(function () { var m = M.meetingsToday[i]; m.sync = "ok"; M.deliveryFailures = M.deliveryFailures.filter(function (d) { if (d.channel === "Google Calendar" && d.target.indexOf(m.student) > -1) { bumpKpi("failures", -1); return false; } return true; }); render(); toast("הפגישה סונכרנה ליומן Google."); }, 1000); break;
    case "a-assign-me":
      var rq = M.requestQueue.filter(function (x) { return x.id === id; })[0]; rq.owner = M.staffUser.name; if (rq.status === "new") rq.status = "in_progress"; bumpKpi("unassigned", -1); render(); toast("הפנייה שויכה אלייך."); break;
    case "a-access": toast("בקשת הגישה נשלחה לאחראית הצוות הייעודי."); break;
  }
});
function onAdminFilter(e) {
  var f = e.target.form; if (!f) return;
  if (f.id === "stuFilters") { A.stu = { q: f.elements.sf_q.value.trim(), cohort: f.elements.sf_cohort.value, track: f.elements.sf_track.value, account: f.elements.sf_account.value }; fillStudents(); }
  if (f.id === "rqFilters") { A.rq = { q: f.elements.rf_q.value.trim(), status: f.elements.rf_status.value, type: f.elements.rf_type.value, owner: f.elements.rf_owner.value }; fillRequests(); }
}
document.addEventListener("change", onAdminFilter);
document.addEventListener("input", function (e) { if (e.target.type === "search" && e.target.form && e.target.form.id !== "searchForm") onAdminFilter(e); });
document.addEventListener("submit", function (e) {
  var f = e.target, v;
  switch (f.id) {
    case "aAddForm":
      clearErrs(f); var okA = true, sid = f.elements.as_id.value.trim();
      if (f.elements.as_name.value.trim().length < 2) { setErr(f, "as_name", "יש להזין שם מלא"); okA = false; }
      if (!/^\d{3}-\d{2}-\d{4}$/.test(sid)) { setErr(f, "as_id", "פורמט לא תקין (000-00-0000)"); okA = false; }
      else if (findStudent(sid)) { setErr(f, "as_id", "ת״ז זו כבר קיימת במערכת"); okA = false; }
      if (!/^\S+@\S+\.\S+$/.test(f.elements.as_email.value.trim())) { setErr(f, "as_email", "כתובת דוא״ל לא תקינה"); okA = false; }
      if (!okA) return focusFirstError(f);
      M.students.push({ id: sid, name: f.elements.as_name.value.trim(), email: f.elements.as_email.value.trim(), cohort: f.elements.as_cohort.value, track: f.elements.as_track.value, account: "הוזמנה", obligations: 0, attendance: null });
      closeModal(); render(); toast("התלמידה נוספה ונשלחה אליה הזמנה."); break;
    case "aInviteForm":
      var picked = $all('input[name="inv"]:checked', f).map(function (c) { return c.value; });
      if (!picked.length) { setErr(f, "inv", "יש לבחור לפחות תלמידה אחת"); return; }
      picked.forEach(function (id) { findStudent(id).account = "הוזמנה"; });
      closeModal(); render(); toast("נשלחו " + picked.length + " הזמנות בדוא״ל."); break;
    case "aCorrForm":
      clearErrs(f);
      if (f.elements.cd_reason.value.trim().length < 3) { setErr(f, "cd_reason", "יש לנמק את ההחלטה"); return focusFirstError(f); }
      var cid = f.getAttribute("data-id"), approve = f.getAttribute("data-v") === "approve";
      var c = M.corrections.filter(function (x) { return x.id === cid; })[0];
      M.corrections = M.corrections.filter(function (x) { return x.id !== cid; });
      M.attendance.rows.forEach(function (r) {
        if (r.correction && r.correction.indexOf(cid) > -1) {
          if (approve) { for (var k in M.attendanceStatus) if (M.attendanceStatus[k] === c.requested) r.status = k; }
          else r.status = "absent";
          r.correction = "בקשת תיקון #" + cid + " — " + (approve ? "אושרה" : "נדחתה") + ": " + f.elements.cd_reason.value.trim();
        }
      });
      closeModal(); render(); toast("בקשה " + cid + (approve ? " אושרה." : " נדחתה.") + " התלמידה עודכנה."); break;
    case "aPrForm":
      v = e.submitter ? e.submitter.value : "approved"; clearErrs(f);
      var fb = f.elements.pv_fb.value.trim();
      if (v !== "approved" && fb.length < 5) { setErr(f, "pv_fb", "במצב " + M.reportStatus[v] + " חובה לכתוב משוב לתלמידה"); return focusFirstError(f); }
      var pid = f.getAttribute("data-id"), item = M.practicumQueue.filter(function (x) { return x.id === pid; })[0];
      M.practicumQueue = M.practicumQueue.filter(function (x) { return x.id !== pid; }); bumpKpi("practicum", -1);
      var mine = M.practicum.reports.filter(function (x) { return x.id === pid; })[0];
      if (mine) {
        var P = M.practicum; P.pending -= mine.hours;
        if (v === "approved") P.approved += mine.hours;
        if (v === "rejected") P.reported -= mine.hours;
        mine.status = v; if (v === "returned") mine.feedback = fb;
      }
      closeModal(); render(); toast("דיווח " + pid + " (" + esc(item.student) + "): " + M.reportStatus[v] + "."); break;
    case "aAvailForm":
      clearErrs(f); var okV = true, val = function (n) { return f.elements[n].value; };
      ["av_type", "av_date", "av_from", "av_to"].forEach(function (n) { if (!val(n)) { setErr(f, n, "שדה חובה"); okV = false; } });
      if (val("av_date") && val("av_date") < M.today) { setErr(f, "av_date", "לא ניתן לפתוח זמינות בתאריך שעבר"); okV = false; }
      if (val("av_from") && val("av_to") && toMin(val("av_to")) <= toMin(val("av_from"))) { setErr(f, "av_to", "שעת הסיום חייבת להיות אחרי שעת ההתחלה"); okV = false; }
      var dur = +val("av_dur"), gap = +val("av_gap") || 0, cap = +val("av_cap");
      if (!(dur >= 10)) { setErr(f, "av_dur", "משך מינימלי 10 דקות"); okV = false; }
      if (gap < 0) { setErr(f, "av_gap", "ערך לא תקין"); okV = false; }
      if (!(cap >= 1)) { setErr(f, "av_cap", "קיבולת מינימלית 1"); okV = false; }
      var slots = [];
      if (okV) {
        for (var t = toMin(val("av_from")); t + dur <= toMin(val("av_to")); t += dur + gap) slots.push(("0" + Math.floor(t / 60)).slice(-2) + ":" + ("0" + t % 60).slice(-2));
        if (!slots.length) { setErr(f, "av_dur", "טווח השעות קצר ממשך פגישה אחת"); okV = false; }
      }
      if (!okV) return focusFirstError(f);
      var typ = M.appointmentTypes.filter(function (x) { return x.id === val("av_type"); })[0];
      A.avail.unshift({ date: isoToDM(val("av_date")), type: typ.name, slots: slots, cap: cap });
      render(); toast("נפתחו " + slots.length + " משבצות ב-" + isoToDM(val("av_date")) + "."); break;
    case "aReqMeta":
      var r = M.requestQueue.filter(function (x) { return x.id === f.getAttribute("data-id"); })[0], hadOwner = !!r.owner;
      r.owner = f.elements.rm_owner.value || null; r.priority = f.elements.rm_prio.value; r.status = f.elements.rm_status.value; r.updated = "עכשיו";
      if (hadOwner !== !!r.owner) bumpKpi("unassigned", r.owner ? -1 : 1);
      var sr = M.requests.filter(function (x) { return x.id === r.id; })[0]; if (sr) { sr.status = r.status; sr.owner = r.owner || "טרם שויכה"; }
      render(); toast("פרטי הפנייה נשמרו."); break;
    case "aReplyForm":
      clearErrs(f);
      if (f.elements.ar_text.value.trim().length < 2) { setErr(f, "ar_text", "יש לכתוב תשובה"); return focusFirstError(f); }
      var rr = M.requestQueue.filter(function (x) { return x.id === f.getAttribute("data-id"); })[0];
      adminThread(rr).push({ me: false, who: M.staffUser.name, at: fmtDM(TODAY) + " " + nowHM(), text: f.elements.ar_text.value.trim() });
      rr.status = f.elements.ar_wait.checked ? "waiting_student" : "in_progress"; rr.updated = "עכשיו";
      var sr2 = M.requests.filter(function (x) { return x.id === rr.id; })[0]; if (sr2) { sr2.status = rr.status; sr2.lastMsg = f.elements.ar_text.value.trim(); }
      render(); toast("התשובה נשלחה לתלמידה."); break;
    case "aNoteForm":
      clearErrs(f);
      if (f.elements.an_text.value.trim().length < 2) { setErr(f, "an_text", "יש לכתוב הערה"); return focusFirstError(f); }
      var nid = f.getAttribute("data-id"); (A.notes[nid] = A.notes[nid] || []).push({ who: M.staffUser.name, at: fmtDM(TODAY) + " " + nowHM(), text: f.elements.an_text.value.trim() });
      render(); toast("ההערה הפנימית נשמרה (לא מוצגת לתלמידה)."); break;
  }
});


/* ===================== Init ===================== */
render();
})();
</script>
