<!doctype html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מערכת שנה ג׳ · מודרני כהה</title>
<script>
  /* קביעת ערכת צבעים לפני הציור כדי למנוע הבהוב */
  (function () {
    var t = "dark";
    try { t = localStorage.getItem("y3-d3-theme") || "dark"; } catch (e) {}
    document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ================= TOKENS ================= */
:root {
  --bg: #0b0f17; --bg-2: #0d121b; --panel: #111823; --panel-2: #151d2a; --hover: #1a2332;
  --border: #212b3a; --border-2: #2c3849;
  --text: #e6eaf2; --muted: #93a0b5; --faint: #75829a;
  --accent: #2dd4bf; --accent-2: #5eead4; --accent-ink: #032a25; --accent-soft: rgba(45, 212, 191, .12);
  --ok: #4ade80; --ok-soft: rgba(74, 222, 128, .11);
  --warn: #fbbf24; --warn-soft: rgba(251, 191, 36, .11);
  --danger: #f87171; --danger-soft: rgba(248, 113, 113, .12);
  --info: #60a5fa; --info-soft: rgba(96, 165, 250, .12);
  --violet: #c4b5fd; --violet-soft: rgba(167, 139, 250, .13);
  --shadow: 0 18px 50px rgba(0, 0, 0, .55);
  --radius: 10px; --radius-sm: 6px;
  --font: "IBM Plex Sans Hebrew", "Heebo", system-ui, sans-serif;
  --mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f4f6f9; --bg-2: #eceff4; --panel: #ffffff; --panel-2: #f7f8fa; --hover: #eef1f5;
  --border: #dfe3ea; --border-2: #c9d0db;
  --text: #0f1623; --muted: #4f5a6b; --faint: #626d7f;
  --accent: #0f766e; --accent-2: #0d9488; --accent-ink: #ffffff; --accent-soft: rgba(13, 148, 136, .10);
  --ok: #15803d; --ok-soft: rgba(21, 128, 61, .09);
  --warn: #a15c07; --warn-soft: rgba(217, 119, 6, .11);
  --danger: #b91c1c; --danger-soft: rgba(220, 38, 38, .08);
  --info: #1d4ed8; --info-soft: rgba(37, 99, 235, .08);
  --violet: #6d28d9; --violet-soft: rgba(124, 58, 237, .08);
  --shadow: 0 18px 50px rgba(15, 22, 35, .16);
  color-scheme: light;
}
.t-accent { --c: var(--accent); --cs: var(--accent-soft); }
.t-ok { --c: var(--ok); --cs: var(--ok-soft); }
.t-warn { --c: var(--warn); --cs: var(--warn-soft); }
.t-danger { --c: var(--danger); --cs: var(--danger-soft); }
.t-info { --c: var(--info); --cs: var(--info-soft); }
.t-violet { --c: var(--violet); --cs: var(--violet-soft); }
.t-muted { --c: var(--muted); --cs: var(--panel-2); }

/* ================= BASE ================= */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.55 var(--font); overflow-x: hidden; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -.005em; }
h1 { font-size: 22px; }
h2 { font-size: 15px; }
h3 { font-size: 14px; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
[tabindex="-1"]:focus { outline: none; }
.mono { font-family: var(--mono); font-feature-settings: "tnum"; font-size: .93em; unicode-bidi: isolate; letter-spacing: -.01em; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.xs { font-size: 11.5px; }
.strike { text-decoration: line-through; text-decoration-thickness: 1.5px; }
.skip:focus { position: fixed !important; top: 8px; inset-inline-start: 8px; width: auto !important; height: auto !important; clip: auto !important; margin: 0 !important; padding: 8px 12px !important; background: var(--accent); color: var(--accent-ink); z-index: 300; border-radius: 6px; }
[hidden] { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.ico { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.stack-sm > * + * { margin-top: 6px; }
.stack > * + * { margin-top: 12px; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--muted); }
hr.sep { border: 0; border-top: 1px solid var(--border); margin: 14px 0; }

/* ================= SHELL ================= */
.app { display: grid; grid-template-columns: 64px minmax(0, 1fr); min-height: 100vh; }
.rail {
  position: sticky; top: 0; height: 100vh; z-index: 30;
  display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 0;
  background: var(--bg-2); border-inline-end: 1px solid var(--border);
}
.rail-logo { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 9px; margin-bottom: 10px;
  background: linear-gradient(135deg, var(--accent), var(--info)); color: #041014; font: 700 13px var(--mono); position: relative; }
.rail-logo:hover { text-decoration: none; }
.rail-list { display: flex; flex-direction: column; gap: 4px; align-items: center; }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 4px; }
.rail-btn {
  position: relative; display: grid; place-items: center; width: 42px; height: 42px; border-radius: 9px;
  color: var(--muted); border: 1px solid transparent; background: none; cursor: pointer;
}
.rail-btn .ico { width: 19px; height: 19px; }
.rail-btn:hover { background: var(--hover); color: var(--text); text-decoration: none; }
.rail-btn.active { background: var(--accent-soft); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
.rail-btn.active::before { content: ""; position: absolute; inset-inline-start: -12px; top: 10px; bottom: 10px; width: 3px; border-radius: 3px; background: var(--accent); }
.rail-lbl { display: none; }
[data-tip]::after {
  content: attr(data-tip); position: absolute; inset-inline-start: calc(100% + 12px); top: 50%; transform: translateY(-50%);
  white-space: nowrap; background: var(--text); color: var(--bg); font: 500 12px var(--font); padding: 4px 9px; border-radius: 6px;
  opacity: 0; pointer-events: none; transition: opacity .12s; z-index: 40;
}
[data-tip]:hover::after, [data-tip]:focus-visible::after { opacity: 1; }
.rail-badge { position: absolute; top: 3px; inset-inline-end: 3px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px;
  background: var(--warn); color: var(--bg); font: 600 10px/16px var(--mono); text-align: center; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 10px 24px;
  background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border); min-height: 56px;
}
.crumbs { display: flex; align-items: center; gap: 8px; font-size: 13px; min-width: 0; white-space: nowrap; }
.crumb-role { color: var(--muted); }
.crumb-sep { color: var(--border-2); }
.crumb-cur { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.seg { display: inline-flex; padding: 2px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); }
.seg a { padding: 3px 12px; border-radius: 6px; color: var(--muted); font-size: 12.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.seg a:hover { text-decoration: none; color: var(--text); }
.seg a[aria-current="true"] { background: var(--panel-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--border-2); }
.seg a[aria-current="true"] .ico { color: var(--accent); }
.cmdk {
  margin-inline-start: auto; display: flex; align-items: center; gap: 8px; width: min(340px, 34vw); height: 34px; padding: 0 10px;
  background: var(--panel); border: 1px solid var(--border); border-radius: 8px; color: var(--muted); cursor: pointer; text-align: start;
}
.cmdk:hover { border-color: var(--border-2); color: var(--text); }
.cmdk-txt { flex: 1; font-size: 13px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
kbd { font: 500 11px var(--mono); padding: 1px 6px; border: 1px solid var(--border-2); border-bottom-width: 2px; border-radius: 5px; color: var(--muted); background: var(--panel-2); }
.top-actions { display: flex; align-items: center; gap: 6px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font: 600 12px var(--font);
  background: var(--panel-2); border: 1px solid var(--border-2); color: var(--accent); }
.content { padding: 22px 24px 48px; max-width: 1440px; width: 100%; margin: 0 auto; }

/* ================= PRIMITIVES ================= */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 7px;
  border: 1px solid var(--border-2); background: var(--panel-2); color: var(--text); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap;
}
.btn:hover { background: var(--hover); text-decoration: none; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
.btn.primary:hover { background: var(--accent-2); }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); background: var(--danger-soft); }
.btn.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); background: var(--ok-soft); }
.btn.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); background: var(--warn-soft); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--text); background: var(--hover); }
.btn.sm { height: 28px; padding: 0 9px; font-size: 12.5px; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; pointer-events: none; }
.icon-btn { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 7px; border: 1px solid var(--border); background: var(--panel); color: var(--muted); cursor: pointer; }
.icon-btn:hover { color: var(--text); background: var(--hover); }
.icon-btn.sm { width: 26px; height: 26px; }

.pill {
  display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; white-space: nowrap;
  font-size: 12px; font-weight: 500; color: var(--c, var(--muted)); background: var(--cs, var(--panel-2));
  border: 1px solid color-mix(in srgb, var(--c, var(--muted)) 32%, transparent);
}
.pill .ico { width: 12px; height: 12px; stroke-width: 2.2; }
.pill.dashed { border-style: dashed; background: transparent; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); border: 1px solid var(--border); border-radius: 5px; padding: 1px 7px; background: var(--panel-2); white-space: nowrap; }
.tag .ico { width: 12px; height: 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 2px 9px; border: 1px solid var(--border); border-radius: 999px; background: var(--panel); }

.card { scroll-margin-top: 72px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; min-width: 0; position: relative; }
.card.flush { padding: 0; overflow: hidden; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.card-h h2 { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
.card-h h2 .ico { color: var(--muted); }
.card.flush .card-h { padding: 14px 16px 0; }
a.card-link { display: block; color: inherit; transition: border-color .12s, background .12s; }
a.card-link:hover { text-decoration: none; border-color: var(--border-2); background: color-mix(in srgb, var(--panel) 70%, var(--hover)); }
a.card-link .go { position: absolute; top: 14px; inset-inline-end: 14px; color: var(--faint); }
a.card-link:hover .go { color: var(--accent); }
.more { font-size: 12.5px; display: inline-flex; align-items: center; gap: 4px; }
.more .ico { width: 13px; height: 13px; }

.bento { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px; }
.c-2 { grid-column: span 2; } .c-3 { grid-column: span 3; } .c-4 { grid-column: span 4; } .c-5 { grid-column: span 5; }
.c-6 { grid-column: span 6; } .c-7 { grid-column: span 7; } .c-8 { grid-column: span 8; } .c-9 { grid-column: span 9; } .c-12 { grid-column: span 12; }

.page-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.page-h .sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
.page-h .row { gap: 6px; }

.big { font: 600 30px/1.1 var(--mono); letter-spacing: -.03em; }
.big small { font-size: 14px; color: var(--muted); font-weight: 500; letter-spacing: 0; }
.kpi-lbl { font-size: 12.5px; color: var(--muted); }

.meter { position: relative; height: 6px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--border); overflow: visible; }
.meter > span { display: block; height: 100%; border-radius: 4px; background: var(--c, var(--accent)); }
.meter-mark { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--text); opacity: .55; border-radius: 1px; }
.stackbar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--panel-2); border: 1px solid var(--border); }
.stackbar span { display: block; height: 100%; }
.seg-ok { background: var(--ok); }
.seg-pend { background: repeating-linear-gradient(-45deg, var(--warn) 0 3px, transparent 3px 6px); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-inline-end: 5px; vertical-align: -1px; border: 1px solid var(--border-2); }
.spark { display: block; overflow: visible; direction: ltr; }
.spark-l { fill: none; stroke: var(--c, var(--accent)); stroke-width: 1.6; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.spark-a { fill: var(--c, var(--accent)); opacity: .12; }
.spark-d { fill: var(--c, var(--accent)); }
.ring circle { fill: none; stroke-width: 7; }
.ring .ring-bg { stroke: var(--panel-2); }
.ring .ring-fg { stroke: var(--c, var(--accent)); stroke-linecap: round; }
.ring-wrap { position: relative; display: inline-grid; place-items: center; }
.ring-wrap .ring-val { position: absolute; font: 600 18px var(--mono); }

/* tables */
.tbl-wrap { overflow-x: auto; border-top: 1px solid var(--border); }
.card > .tbl-wrap:first-child { border-top: 0; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: start; font-size: 11.5px; font-weight: 600; color: var(--muted); letter-spacing: .02em; padding: 9px 12px; background: var(--panel-2); border-bottom: 1px solid var(--border); white-space: nowrap; }
.tbl td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr:hover td { background: color-mix(in srgb, var(--hover) 55%, transparent); }
.tbl td.nw, .tbl .nw { white-space: nowrap; }
.tbl tr.clickable { cursor: pointer; }
.tbl tr.hl td { background: var(--warn-soft); }
.tbl tr.hl td:first-child { box-shadow: inset -3px 0 0 var(--warn); }
.tbl .num { font-family: var(--mono); text-align: end; }

/* forms */
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.form-grid .full { grid-column: 1 / -1; }
.form-grid.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label, .field > .lbl { font-size: 12.5px; font-weight: 500; color: var(--muted); }
.req::after { content: " *"; color: var(--danger); }
.input, .field input:not([type="checkbox"]):not([type="radio"]), .field select, .field textarea, select.input {
  width: 100%; min-height: 34px; padding: 6px 10px; border-radius: 7px; border: 1px solid var(--border-2);
  background: var(--bg-2); color: var(--text); font-size: 13.5px;
}
.field textarea { min-height: 72px; resize: vertical; }
.field input[type="file"] { padding: 5px; font-size: 12.5px; }
.field input:focus, .field select:focus, .field textarea:focus, .input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.field.invalid input, .field.invalid select, .field.invalid textarea { border-color: var(--danger); box-shadow: 0 0 0 1px var(--danger); }
.err { color: var(--danger); font-size: 12px; display: flex; gap: 5px; align-items: center; }
.err::before { content: "!"; display: inline-grid; place-items: center; width: 14px; height: 14px; border-radius: 50%; background: var(--danger); color: var(--bg); font: 700 10px var(--mono); }
.hint { font-size: 12px; color: var(--muted); }
.form-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-start; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
.check { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; cursor: pointer; }
.check input { accent-color: var(--accent); width: 15px; height: 15px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 16px; }
.filters .input { width: auto; min-width: 140px; height: 32px; min-height: 32px; padding: 4px 8px; font-size: 13px; }
.filters .search { position: relative; flex: 1; min-width: 180px; }
.filters .search .input { width: 100%; padding-inline-start: 32px; }
.filters .search .ico { position: absolute; inset-inline-start: 9px; top: 8px; color: var(--muted); }
.count { margin-inline-start: auto; font-size: 12px; color: var(--muted); }

/* callouts */
.callout { display: flex; gap: 10px; padding: 11px 13px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); background: var(--cs); font-size: 13px; }
.callout > .ico { color: var(--c); margin-top: 2px; }
.callout strong { color: var(--c); }
.empty { padding: 26px; text-align: center; color: var(--muted); font-size: 13px; }

/* list rows */
.lrow { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); }
.lrow:first-child { border-top: 0; padding-top: 2px; }
a.lrow { color: inherit; }
a.lrow:hover { text-decoration: none; background: color-mix(in srgb, var(--hover) 40%, transparent); }
.datebox { flex: none; width: 46px; text-align: center; border: 1px solid var(--border); border-radius: 7px; padding: 3px 0; background: var(--panel-2); line-height: 1.2; }
.datebox b { display: block; font: 600 13px var(--mono); }
.datebox span { font-size: 11px; color: var(--muted); }

/* ================= OVERLAYS ================= */
.overlay { position: fixed; inset: 0; z-index: 100; background: rgba(3, 6, 12, .62); display: flex; align-items: flex-start; justify-content: center; padding: 8vh 16px 16px; }
:root[data-theme="light"] .overlay { background: rgba(15, 22, 35, .35); }
.overlay[hidden] { display: none; }
.modal, .palette, .drawer { background: var(--panel); border: 1px solid var(--border-2); border-radius: 12px; box-shadow: var(--shadow); width: min(560px, 100%); max-height: 84vh; display: flex; flex-direction: column; }
.modal.wide { width: min(780px, 100%); }
.overlay.drawer-ov { padding: 0; justify-content: flex-start; align-items: stretch; }
.drawer { width: min(720px, 100%); max-height: none; height: 100%; border-radius: 0; border-width: 0; border-inline-end: 1px solid var(--border-2); animation: slideIn .18s ease-out; }
@keyframes slideIn { from { transform: translateX(30px); opacity: .4; } to { transform: none; opacity: 1; } }
.mdl-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
.mdl-h h2 { flex: 1; font-size: 15px; }
.mdl-b { padding: 16px; overflow-y: auto; }
.mdl-f { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); flex-wrap: wrap; }
.palette { width: min(600px, 100%); overflow: hidden; }
.pal-in { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
.pal-in input { flex: 1; background: none; border: 0; font-size: 15px; outline: none; color: var(--text); }
.pal-list { overflow-y: auto; padding: 6px; max-height: 56vh; }
.pal-grp { font-size: 11px; color: var(--muted); padding: 8px 10px 4px; font-weight: 600; letter-spacing: .05em; }
.pal-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px; cursor: pointer; font-size: 13.5px; }
.pal-item .hint { margin-inline-start: auto; }
.pal-item[aria-selected="true"] { background: var(--accent-soft); color: var(--text); }
.pal-item[aria-selected="true"] .ico { color: var(--accent); }
.pal-foot { display: flex; gap: 14px; padding: 8px 14px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--muted); }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); overflow-x: auto; padding: 0 12px; scrollbar-width: thin; }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; padding: 9px 10px; font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
.tab:hover { color: var(--text); }
dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 8px 18px; margin: 0; font-size: 13px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; }

#toasts { position: fixed; bottom: 18px; inset-inline-end: 18px; z-index: 200; display: flex; flex-direction: column; gap: 8px; width: min(380px, calc(100vw - 32px)); }
.toast { display: flex; gap: 10px; align-items: flex-start; padding: 11px 12px; background: var(--panel); border: 1px solid var(--border-2); border-inline-start: 3px solid var(--c); border-radius: 9px; box-shadow: var(--shadow); animation: toastIn .18s ease-out; }
.toast > .ico { color: var(--c); margin-top: 2px; }
.toast > div { flex: 1; }
.toast-t { font-weight: 600; font-size: 13.5px; }
.toast-s { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.toast.out { opacity: 0; transform: translateY(6px); transition: .2s; }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } }

/* ================= SCREEN-SPECIFIC ================= */
.na { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); background:
  radial-gradient(120% 140% at 100% 0%, var(--accent-soft), transparent 60%), var(--panel); }
.na-title { font-size: 19px; margin: 8px 0 4px; }
.na-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 16px; }
.me-h { display: flex; align-items: center; gap: 14px; }
.me-h .avatar { width: 46px; height: 46px; font-size: 15px; }

.sess { display: grid; grid-template-columns: 56px 108px minmax(0, 1fr) auto auto; gap: 14px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--border); }
.sess:first-child { border-top: 0; }
.sess.cancelled { background: repeating-linear-gradient(-45deg, transparent 0 8px, color-mix(in srgb, var(--danger) 5%, transparent) 8px 16px); }
.sess.cancelled .sess-title, .sess.cancelled .sess-time { color: var(--muted); }
.sess-title { font-weight: 600; }
.change-note { margin-top: 5px; font-size: 12.5px; display: inline-flex; gap: 6px; align-items: center; color: var(--c); }
.change-note .ico { width: 13px; height: 13px; }
.sess-tags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.sess-time { font-size: 13px; }

.stepper { display: flex; gap: 0; counter-reset: st; }
.stepper li { flex: 1; position: relative; padding-top: 4px; text-align: center; min-width: 0; }
.stepper li::before { content: ""; position: absolute; top: 19px; inset-inline-start: 50%; width: 100%; height: 2px; background: var(--border-2); z-index: 0; }
.stepper li:last-child::before { display: none; }
.stepper li.done::before { background: var(--ok); }
.st-dot { position: relative; z-index: 1; width: 32px; height: 32px; margin: 0 auto 8px; border-radius: 50%; display: grid; place-items: center; background: var(--panel); border: 2px solid var(--border-2); color: var(--muted); font: 600 12px var(--mono); }
.done .st-dot { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); }
.current .st-dot { border-color: var(--accent); color: var(--accent-ink); background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.st-name { font-size: 13px; font-weight: 600; }
.locked .st-name { color: var(--muted); }
.st-state { font-size: 11.5px; color: var(--muted); }

.timeline > li { position: relative; padding: 0 22px 16px 0; border-inline-start: 0; }
.timeline > li::before { content: ""; position: absolute; inset-inline-start: 5px; top: 6px; bottom: -6px; width: 1px; background: var(--border-2); }
.timeline > li:last-child::before { display: none; }
.timeline > li::after { content: ""; position: absolute; inset-inline-start: 0; top: 5px; width: 11px; height: 11px; border-radius: 50%; background: var(--panel); border: 2px solid var(--c, var(--border-2)); }
.feedback { margin-top: 8px; padding: 8px 11px; border-radius: 7px; background: var(--panel-2); border: 1px solid var(--border); font-size: 13px; }
.feedback b { font-size: 11.5px; color: var(--muted); display: block; font-weight: 600; margin-bottom: 2px; }

.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 11px 12px; border: 1px solid var(--border); border-radius: 9px; background: var(--panel-2); cursor: pointer; }
.opt:hover { border-color: var(--border-2); }
.opt input { accent-color: var(--accent); margin-top: 3px; }
.opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.opt:has(input:disabled) { opacity: .55; cursor: not-allowed; }
.opt:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.cond { display: flex; gap: 9px; align-items: flex-start; padding: 7px 0; font-size: 13px; }
.cond .mark { flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--cs); color: var(--c); }
.cond .mark .ico { width: 12px; height: 12px; stroke-width: 2.6; }
.wiz-steps { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.wiz-steps li { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; padding: 3px 10px 3px 6px; border: 1px solid var(--border); border-radius: 999px; }
.wiz-steps li b { font: 600 11px var(--mono); width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: var(--panel-2); }
.wiz-steps li[aria-current="step"] { color: var(--text); border-color: var(--accent); }
.wiz-steps li[aria-current="step"] b { background: var(--accent); color: var(--accent-ink); }
.wiz-steps li.done b { background: var(--ok-soft); color: var(--ok); }
.confirm-box { text-align: center; padding: 18px 8px; }
.confirm-box .big-ico { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 10px; background: var(--ok-soft); color: var(--ok); }
.confirm-box .big-ico .ico { width: 26px; height: 26px; stroke-width: 2.4; }

.split { display: grid; grid-template-columns: minmax(260px, 360px) minmax(0, 1fr); gap: 12px; align-items: start; }
.req-item { display: block; width: 100%; text-align: start; padding: 11px 14px; border: 0; border-top: 1px solid var(--border); background: none; cursor: pointer; }
.req-item:first-child { border-top: 0; }
.req-item:hover { background: var(--hover); }
.req-item[aria-current="true"] { background: var(--accent-soft); box-shadow: inset -3px 0 0 var(--accent); }
.req-item .t { font-weight: 600; font-size: 13.5px; margin: 3px 0; }
.thread { display: flex; flex-direction: column; gap: 10px; padding: 16px; }
.msg { max-width: 82%; padding: 9px 12px; border-radius: 10px; font-size: 13.5px; border: 1px solid var(--border); background: var(--panel-2); }
.msg .who { font-size: 11.5px; color: var(--muted); margin-bottom: 3px; display: flex; gap: 8px; }
.msg.me { align-self: flex-start; background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
.msg.staff { align-self: flex-end; }
.msg.note { align-self: stretch; max-width: none; background: var(--warn-soft); border: 1px dashed var(--warn); }
.msg.note .who { color: var(--warn); font-weight: 600; }
.msg.sys { align-self: center; background: none; border: 0; font-size: 12px; color: var(--muted); padding: 2px; }
.note-box { border: 1px dashed var(--warn); background: var(--warn-soft); border-radius: 9px; padding: 12px; }
.note-box .lbl { color: var(--warn); font-weight: 600; display: flex; gap: 6px; align-items: center; font-size: 12.5px; margin-bottom: 6px; }
.restricted { display: grid; place-items: center; gap: 8px; text-align: center; padding: 40px 20px; color: var(--muted);
  background: repeating-linear-gradient(-45deg, transparent 0 10px, var(--panel-2) 10px 20px); border-radius: 9px; border: 1px dashed var(--border-2); margin: 16px; }
.restricted .ico { width: 28px; height: 28px; }

.kpi { display: flex; flex-direction: column; gap: 6px; min-height: 118px; }
.kpi .big { font-size: 34px; }
.kpi.alert { border-color: color-mix(in srgb, var(--danger) 50%, var(--border)); background: linear-gradient(var(--danger-soft), transparent), var(--panel); }
.kpi.alert .big { color: var(--danger); }
.minibars { display: flex; gap: 3px; align-items: flex-end; height: 22px; margin-top: auto; direction: ltr; }
.minibars i { flex: 1; background: var(--c, var(--accent)); opacity: .35; border-radius: 2px 2px 0 0; }
.minibars i:last-child { opacity: 1; }
.flash { animation: flash 1.4s ease-out; }
@keyframes flash { 0%, 30% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }
.status-sel { height: 30px; min-height: 30px; padding: 2px 6px; font-size: 12.5px; min-width: 110px; }
.min-in { width: 80px !important; height: 30px; min-height: 30px; font-family: var(--mono); }

/* ================= RESPONSIVE ================= */
@media (max-width: 1100px) {
  .c-3, .c-4 { grid-column: span 6; }
  .c-5, .c-7, .c-8, .c-9 { grid-column: span 12; }
  .sess { grid-template-columns: 56px 100px minmax(0, 1fr); }
  .sess-tags, .sess-act { grid-column: 3; justify-content: flex-start; }
}
@media (max-width: 900px) {
  .split { grid-template-columns: 1fr; }
  .c-6 { grid-column: span 12; }
  .crumbs .crumb-role, .crumbs .crumb-sep { display: none; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; top: auto; bottom: 0; inset-inline: 0; height: 62px; width: 100%; flex-direction: row; padding: 6px 8px;
    border-inline-end: 0; border-top: 1px solid var(--border); overflow-x: auto; overflow-y: hidden; justify-content: flex-start; }
  .rail-logo, .rail-foot { display: none; }
  .rail-list { flex-direction: row; gap: 2px; flex: 1; }
  .rail-list li { flex: 1; min-width: 42px; }
  .rail-btn { width: 100%; height: 50px; grid-template-rows: 22px auto; gap: 1px; align-content: center; }
  .rail-btn.active::before { inset-inline-start: 14px; inset-inline-end: 14px; top: -7px; bottom: auto; width: auto; height: 3px; }
  .rail-lbl { display: block; font-size: 10px; line-height: 1.1; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  [data-tip]::after { display: none; }
  .topbar { padding: 8px 12px; gap: 8px; flex-wrap: wrap; }
  .crumbs { display: none; }
  .cmdk { width: auto; flex: 1; margin-inline-start: 0; order: 3; flex-basis: 100%; }
  .cmdk kbd { display: none; }
  .hide-sm span { display: none; }
  .content { padding: 16px 16px 92px; }
  .c-3, .c-4, .c-6 { grid-column: span 12; }
  .form-grid, .form-grid.g3 { grid-template-columns: minmax(0, 1fr); }
  .sess { grid-template-columns: 50px minmax(0, 1fr); gap: 10px; }
  .sess-time { grid-column: 2; }
  .sess-main, .sess-tags, .sess-act { grid-column: 1 / -1; }
  .stepper { flex-direction: column; gap: 10px; }
  .stepper li { display: grid; grid-template-columns: 34px 1fr; text-align: start; gap: 0 10px; padding: 0; }
  .stepper li::before { display: none; }
  .st-dot { margin: 0; grid-row: span 2; }
  #toasts { bottom: 76px; inset-inline: 16px; width: auto; }
  .msg { max-width: 94%; }
  h1 { font-size: 19px; }
  .overlay { padding: 4vh 10px 10px; }
  .overlay.drawer-ov { padding: 0; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

function ico(name, cls) { return `<svg class="ico ${cls || ""}" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${ICONS[name] || ""}</svg>`; }

const ddmmToIso = (d) => { const m = /^(\d{2})\/(\d{2})/.exec(d || ""); return m ? `${YEAR}-${m[2]}-${m[1]}` : ""; };
const isoToDdmm = (iso) => { const m = /^\d{4}-(\d{2})-(\d{2})$/.exec(iso || ""); return m ? `${m[2]}/${m[1]}` : iso; };
const dayOf = (iso) => DAYS[new Date(iso + "T12:00:00").getDay()];

const toMin = (t) => { const m = /^(\d{1,2}):(\d{2})$/.exec(t || ""); return m ? +m[1] * 60 + +m[2] : NaN; };

  w = w || 120; h = h || 32;

/* --- ולידציה --- */
function fieldOf(form, name) { const el = form.elements[name]; if (!el) return null; return el.tagName ? el : el[0]; }
function setErr(form, name, msg) {
  const el = fieldOf(form, name); if (!el) return;
  const f = el.closest(".field") || el.parentElement;
  f.classList.add("invalid");
  el.setAttribute("aria-invalid", "true");
  let e = f.querySelector(".err");
  if (!e) { e = document.createElement("div"); e.className = "err"; e.id = `err-${form.id || "f"}-${name}`; f.appendChild(e); }
  e.textContent = msg;

}
function clearErrs(form) {
  $$(".field.invalid", form).forEach((f) => f.classList.remove("invalid"));
  $$(".err", form).forEach((e) => e.remove());
  $$("[aria-invalid]", form).forEach((e) => { e.removeAttribute("aria-invalid"); e.removeAttribute("aria-describedby"); });
}
/* rules: [[name, (value, form) => "הודעת שגיאה" | ""], ...] */
function validate(form, rules) {
  clearErrs(form);
  let first = null, n = 0;
  const bad = new Set();
  rules.forEach(([name, test]) => {
    const el = form.elements[name]; if (!el || bad.has(name)) return;
    const v = el.type === "file" ? (el.files && el.files.length ? el.files[0].name : "") : String(el.value || "").trim();
    const msg = test(v, form);
    if (msg) { bad.add(name); setErr(form, name, msg); n++; if (!first) first = fieldOf(form, name); }
  });
  if (first) { first.focus(); toast(n === 1 ? "יש לתקן שדה אחד בטופס" : `יש לתקן ${n} שדות בטופס`, "danger"); }
  return !first;
}
const required = (label) => (v) => (v ? "" : `שדה חובה: ${label}`);
const minLen = (n, label) => (v) => (!v ? `שדה חובה: ${label}` : v.length < n ? `נא לכתוב לפחות ${n} תווים` : "");

  form.addEventListener("input", (e) => {

    f.classList.remove("invalid"); const er = f.querySelector(".err"); if (er) er.remove(); e.target.removeAttribute("aria-invalid");

}
function go(role, id, q) { location.hash = `${role}/${id}${q ? "?" + q : ""}`; }

/* --- פלטת פקודות --- */
function openPalette() {
  const items = [];
  Object.keys(ROLES).forEach((rk) => ROLES[rk].screens.forEach((s) => items.push({ grp: ROLES[rk].label, label: s.label, icon: s.icon, hint: `#${rk}/${s.id}`, run: () => go(rk, s.id) })));
  items.push({ grp: "פעולות", label: "החלפת מצב כהה / בהיר", icon: "sun", hint: "ערכת צבעים", run: () => setTheme(currentTheme() === "light" ? "dark" : "light") });
  items.push({ grp: "פעולות", label: "חזרה לעמוד הכניסה", icon: "home", hint: "index.html", run: () => { location.href = "index.html"; } });
  Object.keys(ROLES).forEach((rk) => (ROLES[rk].commands || []).forEach((c) => items.push(Object.assign({ grp: "פעולות" }, c))));
  let sel = 0, shown = items;
  const box = openModal({
    kind: "palette",
    title: '<span class="sr-only">פלטת פקודות</span>',
    body: "",
    onMount(b) {
      b.removeAttribute("aria-labelledby"); b.setAttribute("aria-label", "פלטת פקודות");
      b.querySelector(".mdl-h").outerHTML = `<div class="pal-in">${ico("search")}<label class="sr-only" for="palq">חיפוש מסך או פעולה</label><input id="palq" autofocus autocomplete="off" placeholder="הקלידי שם מסך או פעולה…" role="combobox" aria-controls="pal-list" aria-expanded="true"><kbd>Esc</kbd></div>`;
      b.querySelector(".mdl-b").outerHTML = `<div class="pal-list" id="pal-list" role="listbox" aria-label="תוצאות"></div><div class="pal-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> ניווט</span><span><kbd>Enter</kbd> בחירה</span></div>`;
    },
  });
  const input = $("#palq", box), list = $("#pal-list", box);
  const paint = () => {
    const q = input.value.trim();
    shown = items.filter((i) => !q || (i.label + " " + i.grp + " " + i.hint).includes(q));
    if (sel >= shown.length) sel = 0;
    let g = null, html = "";
    shown.forEach((it, i) => {
      if (it.grp !== g) { g = it.grp; html += `<div class="pal-grp" role="presentation">${esc(g)}</div>`; }
      html += `<div class="pal-item" role="option" id="pi-${i}" data-i="${i}" aria-selected="${i === sel}">${ico(it.icon || "arrow")}<span>${esc(it.label)}</span><span class="hint mono">${esc(it.hint || "")}</span></div>`;
    });
    list.innerHTML = html || `<div class="empty">לא נמצאו תוצאות עבור “${esc(q)}”</div>`;
    input.setAttribute("aria-activedescendant", shown.length ? `pi-${sel}` : "");
    const a = $(`#pi-${sel}`, list); if (a) a.scrollIntoView({ block: "nearest" });
  };
  const runSel = (i) => { const it = shown[i]; if (!it) return; closeModal(); it.run(); };
  input.addEventListener("input", () => { sel = 0; paint(); });
  input.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); sel = Math.min(shown.length - 1, sel + 1); paint(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); sel = Math.max(0, sel - 1); paint(); }
    else if (e.key === "Enter") { e.preventDefault(); runSel(sel); }
  });
  list.addEventListener("click", (e) => { const it = e.target.closest(".pal-item"); if (it) runSel(+it.dataset.i); });
  list.addEventListener("mousemove", (e) => { const it = e.target.closest(".pal-item"); if (it && +it.dataset.i !== sel) { sel = +it.dataset.i; paint(); } });
  paint();
}

function sSchedule() {
  const courses = uniq(M.sessions.map((s) => s.course));

  return `
  <div class="page-h">
    <div><h1>מערכת שעות</h1><div class="sub">שבוע <span class="mono">${esc(M.sessions[0].date)}–${esc(M.sessions[M.sessions.length - 1].date)}</span> · <span class="mono">${M.sessions.length}</span> מפגשים · <span class="mono">${upd}</span> עודכנו · <span class="mono">${can}</span> בוטלו</div></div>
  </div>
  <section class="card flush">
    <form class="filters" id="sched-f" onsubmit="return false" aria-label="סינון מפגשים">
      <label class="sr-only" for="f-course">קורס</label>
      <select class="input" id="f-course" name="course"><option value="">כל הקורסים</option>${courses.map((c) => `<option ${st.sf.course === c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>
      <label class="sr-only" for="f-mode">אופן המפגש</label>
      <select class="input" id="f-mode" name="mode"><option value="">זום ופרונטלי</option><option ${st.sf.mode === "זום" ? "selected" : ""}>זום</option><option ${st.sf.mode === "פרונטלי" ? "selected" : ""}>פרונטלי</option></select>
      <label class="check"><input type="checkbox" name="cancelled" ${st.sf.cancelled ? "checked" : ""}>הצגת מפגשים שבוטלו</label>
      <span class="count" id="sched-count" aria-live="polite"></span>
    </form>
    <ul id="sched-list" class="tbl-wrap" style="overflow:visible"></ul>
  </section>
  <p class="hint" style="margin-top:10px">${ico("info")} כל השעות בפורמט 24 שעות. מפגש שבוטל נשאר ברשימה עם סיבת הביטול.</p>`;
}
function mSchedule(view) {
  const f = $("#sched-f", view);
  const paint = () => {
    st.sf = { course: f.course.value, mode: f.mode.value, cancelled: f.cancelled.checked };
    const rows = M.sessions.filter((s) => (!st.sf.course || s.course === st.sf.course) && (!st.sf.mode || s.mode === st.sf.mode) && (st.sf.cancelled || s.status !== "cancelled"));
    $("#sched-count", view).textContent = `מוצגים ${rows.length} מתוך ${M.sessions.length}`;
    $("#sched-list", view).innerHTML = rows.length ? rows.map((s) => {
      const cancelled = s.status === "cancelled";
      return `<li class="sess ${cancelled ? "cancelled" : ""}">
        <span class="datebox"><b>${esc(s.date)}</b><span>יום ${esc(s.day)}</span></span>
        <span class="sess-time ${cancelled ? "strike" : ""}">${timeRange(s.start, s.end)}</span>
        <div class="sess-main">
          <div class="sess-title ${cancelled ? "strike" : ""}">${esc(s.course)}</div>
          <div class="small muted">${esc(s.lecturer)} · ${esc(s.location)}</div>
          ${s.change ? `<div class="change-note ${cancelled ? "t-danger" : "t-warn"}">${ico(cancelled ? "ban" : "refresh")}<span>${cancelled ? "סיבת הביטול: " : "מה השתנה: "}${esc(s.change)}</span></div>` : ""}
        </div>
        <div class="sess-tags">${modeTag(s.mode)}${sessStatus(s)}</div>
        <div class="sess-act">${s.mode === "זום" && !cancelled ? `<button type="button" class="btn sm primary" data-act="s_zoom" data-id="${s.id}">${ico("video")}כניסה לזום</button>` : ""}</div>
      </li>`;
    }).join("") : `<li class="empty">אין מפגשים שתואמים לסינון</li>`;
  };
  f.addEventListener("change", paint);
  paint();
}

ACT.s_corr = (btn) => {
  const i = +btn.dataset.i;
  openModal({
    title: "בקשת תיקון נוכחות",
    body: `<form id="corr-f" class="form-grid" novalidate>
      <div class="field full"><label for="cf-s" class="req">מפגש</label><select id="cf-s" name="session">${st.att.map((r, j) => `<option value="${j}" ${j === i ? "selected" : ""} ${r.status === "review" ? "disabled" : ""}>${esc(r.date)} · ${esc(r.course)} · ${esc(M.attendanceStatus[r.status])}</option>`).join("")}</select></div>
      <div class="field"><label for="cf-r" class="req">הסטטוס המבוקש</label><select id="cf-r" name="req"><option value="">בחרי…</option><option>נוכחת</option><option>חלקית</option></select></div>
      <div class="field"><label for="cf-a">צירוף אישור (אופציונלי)</label><input type="file" id="cf-a" name="file"></div>
      <div class="field full"><label for="cf-e" class="req">הסבר</label><textarea id="cf-e" name="explain" placeholder="לדוגמה: התחברתי לזום ממכשיר אחר…"></textarea><span class="hint">לפחות 10 תווים. הבקשה תועבר לרכזת הלימודים.</span></div>
    </form>`,
    footer: `<button type="submit" form="corr-f" class="btn primary">${ico("send")}שליחת הבקשה</button><button type="button" class="btn ghost" data-close>ביטול</button>`,
    onMount(b) {
      const f = $("#corr-f", b); bindClearOnInput(f);
      f.addEventListener("submit", (e) => {
        e.preventDefault();
        if (!validate(f, [["req", required("הסטטוס המבוקש")], ["explain", minLen(10, "הסבר")]])) return;
        const row = st.att[+f.session.value], id = `AC-${st.corrSeq++}`;
        row.status = "review"; row.correction = `בקשת תיקון #${id} — ממתינה להחלטה`;
        closeModal(); refresh();
        toast("בקשת התיקון נשלחה", "ok", `מספר מעקב: <b class="mono">${id}</b> · נעדכן אותך כשתתקבל החלטה`);
      });
    },
  });
};

}
function repDuration(f) {
  const s = toMin(f.start.value), e = toMin(f.end.value), b = +f.brk.value || 0;
  return isNaN(s) || isNaN(e) ? null : e - s - b;
}
function mPracticum(view) {
  const f = $("#rep-f", view); bindClearOnInput(f);
  const upd = () => { const d = repDuration(f); $("#rep-dur", view).innerHTML = d != null && d > 0 ? `משך מחושב: <b class="mono">${fmtMin(d)}</b> שעות` : ""; };
  f.addEventListener("input", upd);
  if (st._scrollToForm) { st._scrollToForm = false; $("#rep-form", view).scrollIntoView({ block: "start" }); $("#rf-d", view).focus({ preventScroll: true }); }
}
function saveRep(status) {
  const f = $("#rep-f");
  const rules = status === "draft"
    ? [["assign", required("שיבוץ")], ["date", (v) => (v && v > M.today ? "לא ניתן לדווח על תאריך עתידי" : "")]]
    : [
        ["assign", required("שיבוץ")],
        ["date", (v) => (!v ? "שדה חובה: תאריך" : v > M.today ? "לא ניתן לדווח על תאריך עתידי" : "")],
        ["place", required("מקום")],
        ["start", required("שעת התחלה")],
        ["end", (v, fm) => (!v ? "שדה חובה: שעת סיום" : toMin(v) <= toMin(fm.start.value) ? "שעת הסיום חייבת להיות אחרי שעת ההתחלה" : "")],
        ["brk", (v, fm) => { const n = +v || 0; const span = toMin(fm.end.value) - toMin(fm.start.value); return n < 0 ? "ערך לא תקין" : span > 0 && n >= span ? "ההפסקה ארוכה ממשך הדיווח" : ""; }],
        ["task", minLen(10, "תיאור המשימה")],
      ];
  if (!validate(f, rules)) return;
  const d = repDuration(f), hours = d && d > 0 ? Math.round((d / 60) * 10) / 10 : 0;
  const date = f.date.value ? isoToDdmm(f.date.value) : "—";
  const task = f.task.value.trim() || "טיוטה ללא תיאור";
  let r = st.editing ? st.reports.find((x) => x.id === st.editing) : null;
  const wasSubmitted = r && r.status !== "draft";
  if (!r) { r = { id: `PR-${st.repSeq++}` }; st.reports.unshift(r); }
  Object.assign(r, { date, hours, task, status });
  delete r.feedback;
  if (status === "pending") { if (!wasSubmitted) st.prac.reported += hours; st.prac.pending += hours; }
  st.editing = null;
  refresh();
  toast(status === "draft" ? "הטיוטה נשמרה" : "הדיווח נשלח לבדיקה", "ok", `מספר דיווח <b class="mono">${r.id}</b>${status === "pending" ? ` · ${hours} שעות ממתינות לאישור המלווה` : ""}`);
}
ACT.s_submitRep = () => saveRep("pending");
ACT.s_draftRep = () => saveRep("draft");

function mProject(view) {

    st.subs.forEach((s) => { if (s.title === f.type.value && s.status === "returned") s.status = "superseded"; });
    st.subs.unshift({ version: v, title: f.type.value, submittedAt: `${todayDdmm} ${fmtMin(new Date().getHours() * 60 + new Date().getMinutes())}`, status: "submitted", note: f.title.value.trim() });

}

      const rf = $("#rr-f", bx), nf = $("#nt-f", bx); bindClearOnInput(rf); bindClearOnInput(nf);
      const repaint = () => { $("#rq-thread", bx).innerHTML = thread(); };
      rf.addEventListener("submit", (e) => {
        e.preventDefault();
        if (!validate(rf, [["text", minLen(2, "תשובה לתלמידה")]])) return;
        const msg = { from: "staff", who: M.staffUser.name, at: `${todayDdmm} ${nowHM()}`, text: rf.text.value.trim() };
        ad.threads[r.id].push(msg);
        if (st.threads[r.id]) st.threads[r.id].push(Object.assign({}, msg));
        r.status = rf.wait.checked ? "waiting_student" : r.status === "new" ? "in_progress" : r.status; r.updated = "עכשיו";
        if (!r.owner) r.owner = M.staffUser.name;
        syncStudentReq(r);
        rf.reset(); repaint(); toast("התשובה נשלחה לתלמידה", "ok", `<span class="mono">${esc(r.id)}</span>`);
      });
      nf.addEventListener("submit", (e) => {
        e.preventDefault();
        if (!validate(nf, [["text", minLen(2, "הערה פנימית")]])) return;
        ad.notes[r.id].push({ from: "note", who: M.staffUser.name, at: `${todayDdmm} ${nowHM()}`, text: nf.text.value.trim() });
        nf.reset(); repaint(); toast("ההערה הפנימית נשמרה", "info", "גלויה לצוות בלבד");
      });
    },
  });
};

    <tbody>${st.subs.map((s) => `<tr><td class="nw" style="font-weight:500">${esc(P.name)}</td><td class="small">${P.members.map(esc).join(", ")}</td><td class="mono">v${s.version}</td><td class="nw">${esc(s.title)}</td><td class="mono nw">${esc(s.submittedAt)}</td><td>${subPill(s.status)}</td><td class="small muted">${esc(s.feedback || "—")}</td></tr>`).join("")}</tbody>

  if (!window.MOCK) { document.getElementById("view").innerHTML = '<div class="empty">לא נמצא קובץ הנתונים shared/data.js</div>'; return; }
